<style>
/* ─────────────────────────────────────────────────────
   DESIGN TOKENS — warm notebook dark-first
   ───────────────────────────────────────────────────── */
:root {
  --bg: #131210;
  --surface: #1d1b17;
  --surface-2: #272420;
  --surface-3: #322f29;
  --border: #3a3730;
  --border-2: #4a4740;
  --accent: #e8920c;
  --accent-2: #f0a830;
  --accent-dim: rgba(232,146,12,.13);
  --accent-dim-2: rgba(232,146,12,.22);
  --text: #f0ece2;
  --text-2: #c4bfb0;
  --text-muted: #8a8474;
  --text-ghost: #5a5650;
  --success: #4ade80;
  --success-dim: rgba(74,222,128,.14);
  --danger: #f87171;
  --danger-dim: rgba(248,113,113,.13);
  --warn: #fbbf24;
  --warn-dim: rgba(251,191,36,.13);
  --info: #60a5fa;
  --info-dim: rgba(96,165,250,.12);
  --purple: #c084fc;
  --purple-dim: rgba(192,132,252,.14);
  --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 20px;
  --nav-h: 64px;
  --head-h: 60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf8f2; --surface: #ffffff; --surface-2: #f4f1e8;
    --surface-3: #ece9dc; --border: #e0dace; --border-2: #ccc7b7;
    --accent: #c07600; --accent-2: #d98800;
    --accent-dim: rgba(192,118,0,.1); --accent-dim-2: rgba(192,118,0,.18);
    --text: #1a1714; --text-2: #4a4540; --text-muted: #7a7060;
    --text-ghost: #b0a898; --success: #16a34a;
    --success-dim: rgba(22,163,74,.12); --danger: #dc2626;
    --danger-dim: rgba(220,38,38,.1); --warn: #d97706;
    --warn-dim: rgba(217,119,6,.1); --info: #2563eb;
    --info-dim: rgba(37,99,235,.1);
    --purple: #9333ea; --purple-dim: rgba(147,51,234,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #faf8f2; --surface: #ffffff; --surface-2: #f4f1e8;
  --surface-3: #ece9dc; --border: #e0dace; --border-2: #ccc7b7;
  --accent: #c07600; --accent-2: #d98800;
  --accent-dim: rgba(192,118,0,.1); --accent-dim-2: rgba(192,118,0,.18);
  --text: #1a1714; --text-2: #4a4540; --text-muted: #7a7060;
  --text-ghost: #b0a898; --success: #16a34a;
  --success-dim: rgba(22,163,74,.12); --danger: #dc2626;
  --danger-dim: rgba(220,38,38,.1); --warn: #d97706;
  --warn-dim: rgba(217,119,6,.1); --info: #2563eb;
  --info-dim: rgba(37,99,235,.1);
  --purple: #9333ea; --purple-dim: rgba(147,51,234,.12);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; overflow: hidden }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px; line-height: 1.5;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

#app {
  display: flex; flex-direction: column;
  height: 100%; max-width: 640px;
  margin: 0 auto; position: relative;
}

/* ── HEADER ── */
.hdr {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 14px; height: var(--head-h);
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
}
.logo {
  font-family: 'Outfit', sans-serif;
  font-size: 18px; font-weight: 800;
  color: var(--accent); letter-spacing: -.5px;
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(232,146,12,.35);
}
.logo-mark svg { width: 18px; height: 18px; color: #fff }
.logo em { color: var(--text); font-style: normal; font-weight: 500; font-size: 16px }
.hdr-btns { display: flex; gap: 6px; align-items: center }
.icn-btn {
  width: 36px; height: 36px; border-radius: var(--r);
  border: 1px solid var(--border);
  background: var(--surface); color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .15s; flex-shrink: 0;
}
.icn-btn:hover { background: var(--surface-2); color: var(--text) }
.icn-btn:active { transform: scale(.93) }
.icn-btn.lit { color: var(--accent); border-color: var(--accent) }

/* ── TABS ── */
.main { flex: 1; overflow: hidden; position: relative }
.tab {
  display: none; flex-direction: column;
  height: 100%; overflow-y: auto;
  padding-bottom: calc(var(--nav-h) + 12px);
}
.tab.on { display: flex }
.tab::-webkit-scrollbar { width: 3px }
.tab::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px }

/* ── BOTTOM NAV ── */
.bot-nav {
  display: flex; height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  flex-shrink: 0;
}
.nav-it {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-muted);
  transition: color .15s; border: none; background: none;
  padding: 8px 4px;
}
.nav-it.on { color: var(--accent) }
.nav-it svg { width: 22px; height: 22px }
.nav-label { font-size: 11px; font-weight: 500 }
.nav-pip {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); margin-top: -2px;
}

/* ── SECTION HEADER ── */
.sec-head {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  flex-shrink: 0;
  flex-wrap: wrap; gap: 8px;
}
.sec-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px; font-weight: 800;
  color: var(--text); letter-spacing: -.4px;
}

/* ── BUTTONS ── */
.add-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 7px 12px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--r);
  font-size: 13px; font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer; transition: all .15s;
  white-space: nowrap; flex-shrink: 0;
}
.add-btn:hover { background: var(--accent-2) }
.add-btn:active { transform: scale(.96) }
.add-btn svg { width: 14px; height: 14px }

/* ── TOASTS ── */
.toasts {
  position: fixed;
  top: calc(var(--head-h) + 8px + env(safe-area-inset-top, 0px));
  left: 50%; transform: translateX(-50%);
  z-index: 300; display: flex; flex-direction: column;
  gap: 6px; pointer-events: none;
  width: min(calc(100% - 24px), 400px);
}
.toast {
  background: var(--surface-3); border: 1px solid var(--border-2);
  border-radius: var(--r-lg); padding: 11px 14px;
  font-size: 14px; color: var(--text);
  box-shadow: 0 4px 20px rgba(0,0,0,.35);
  animation: tin .28s cubic-bezier(.34,1.56,.64,1) forwards;
  display: flex; align-items: center; gap: 10px;
  pointer-events: all;
}
@keyframes tin {
  from { opacity:0; transform:translateY(-6px) scale(.96) }
  to   { opacity:1; transform:translateY(0)    scale(1)   }
}

/* ── Gerencial tab ── */
.ger-tabs { display: flex; gap: 0; border-bottom: 1.5px solid var(--border); margin-bottom: 14px; padding: 0 16px }
.ger-tab-btn {
  flex: 1; padding: 9px 4px 8px; font-size: 11px; font-weight: 700;
  color: var(--text-muted); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1.5px;
  cursor: pointer; font-family: inherit; letter-spacing: .03em; transition: all .15s;
}
.ger-tab-btn.on { color: var(--accent-2); border-bottom-color: var(--accent-2) }
.ger-section { margin-bottom: 20px }
.ger-section-title { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); padding: 0 16px 8px }
.ger-empty { text-align: center; padding: 48px 24px; color: var(--text-muted); font-size: 14px }
.ger-card {
  margin: 0 16px 8px; padding: 12px 14px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-2);
}
.ger-card.ok     { border-left-color: var(--success) }
.ger-card.warn   { border-left-color: #f59e0b; animation: pulse-sla 1.8s ease-in-out infinite }
.ger-card.breach { border-left-color: var(--danger); animation: pulse-sla 0.9s ease-in-out infinite }
.ger-card.neutral { border-left-color: var(--info); animation: none }
.ger-card-clickable { cursor: pointer }
.ger-row  { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px }
.ger-name { font-size: 14px; font-weight: 600; color: var(--text); flex: 1; min-width: 0 }
.ger-time { font-size: 13px; font-weight: 700; flex-shrink: 0 }
.ger-time.ok     { color: var(--success) }
.ger-time.warn   { color: #f59e0b }
.ger-time.breach { color: var(--danger) }
.ger-time.neutral { color: var(--info) }
.ger-meta { font-size: 11px; color: var(--text-muted); margin-top: 4px }
.ger-sla-bar { height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 8px; overflow: hidden }
.ger-sla-fill { height: 100%; border-radius: 2px; transition: width .3s }
.ger-notif-time { font-size: 11px; color: var(--text-muted); margin-top: 3px }
.ger-obs-wrap { margin-top: 8px }
.ger-obs-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px }
.ger-obs-ta {
  width: 100%; box-sizing: border-box; padding: 7px 9px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface-2); color: var(--text);
  font-family: inherit; font-size: 12px; line-height: 1.4; resize: vertical;
  min-height: 52px; outline: none; transition: border-color .15s;
}
.ger-obs-ta:focus { border-color: var(--accent) }
.ger-obs-save {
  margin-top: 5px; padding: 4px 12px; border-radius: 20px;
  border: 1.5px solid var(--accent); background: var(--accent-dim);
  color: var(--accent-2); font-size: 11px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .15s;
}
.ger-obs-save:active { opacity: .7 }
.ger-rank { font-size: 18px; font-weight: 800; color: var(--text-muted); flex-shrink: 0; min-width: 24px }
.ger-stat-row { display: flex; gap: 10px; margin: 0 16px 14px; flex-wrap: wrap }
.ger-stat { flex: 1 1 auto; min-width: 0; padding: 10px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border) }
.ger-stat-val { font-size: 22px; font-weight: 800; color: var(--text) }
.ger-stat-lbl { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px }

@keyframes pulse-sla { 0%,100%{opacity:1} 50%{opacity:.55} }
</style>

/* ── HELPERS ── */
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')

function toast(msg){

  el.className='toast'; el.textContent=msg
  c.appendChild(el); setTimeout(()=>el.remove(),3400)
}

function sendNotif(title, body) {
  if(window.AndroidBridge){ try{ AndroidBridge.showNotification(title, body) }catch(e){} }

  }

/* ── THEME ── */
const THEMES = ['dark','light','']
let _themeIdx = 0
function cycleTheme(){
  _themeIdx = (_themeIdx+1) % THEMES.length
  const t = THEMES[_themeIdx]

  else   document.documentElement.removeAttribute('data-theme')

;(function initTheme(){
  try{
    const saved = parseInt(localStorage.getItem('ger_theme')||'0')

/* ── GERENCIAL SUB-NAV ── */
function goGerTab(tab){
  curGerTab = tab
  document.querySelectorAll('.ger-tab-btn').forEach(b=>b.classList.remove('on'))
  document.querySelectorAll('.nav-it').forEach(b=>b.classList.remove('on'))
  const btn = document.getElementById('gTab-'+tab)
  if(btn) btn.classList.add('on')
  // Also highlight bottom nav
  const navBtns = document.querySelectorAll('.nav-it')
  const tabOrder = ['alertas','parados','separacao','sku']
  const idx = tabOrder.indexOf(tab)
  if(idx>=0 && navBtns[idx]) navBtns[idx].classList.add('on')
  renderGerencial()
}

function renderGerencial(){
  const el = document.getElementById('gerList')
  if(!el) return
  if(curGerTab==='alertas')   renderGerAlertas(el)
  else if(curGerTab==='parados')   renderGerParados(el)
  else if(curGerTab==='separacao') renderGerSeparacao(el)
  else if(curGerTab==='sku')       renderGerSku(el)
}

/* ── GERENCIAL: ALERTAS ── */
function renderGerAlertas(el){
  if(!slaAlerts.length){
    el.innerHTML = `<div class="ger-empty">🔔 Nenhum alerta SLA registrado ainda</div>`
    return
  }
  const cards = slaAlerts.map(a => {
    const cls   = a.isBreach ? 'breach' : 'warn'
    const icon  = a.isBreach ? '🔴' : '⚠️'
    const timeStr = fmtTime(a.firedAt)
    const dateStr = fmtDate(a.firedAt)
    const slaMin  = (a.tipo && TIPO_SLA[a.tipo]) ? TIPO_SLA[a.tipo].slaMs/60000 : null
    const safeId  = a.id.replace(/[^a-zA-Z0-9_]/g,'_')
    return `<div class="ger-card ${cls}">
      <div class="ger-row">
        <div class="ger-name">${icon} ${esc(a.reqTitle)}</div>
        <div class="ger-time ${cls}">${fmtMs(a.elapsedMs)}</div>
      </div>
      <div class="ger-meta">
        <strong>${STATUS_LABELS[a.status]||a.status}</strong> · ${esc(a.contactName)}
        ${a.tipo ? ` · ${TIPO_LABELS[a.tipo]||a.tipo}` : ''}
        ${slaMin ? ` · SLA ${slaMin}min` : ''}
      </div>
      <div class="ger-notif-time">🔔 Notificado em ${dateStr} às ${timeStr}</div>
      <div class="ger-obs-wrap">
        <div class="ger-obs-label">Observação / Justificativa</div>
        <textarea class="ger-obs-ta" id="obs-${safeId}" rows="2" placeholder="Ex: separador estava ocupado em outro pedido…">${esc(a.obs||'')}</textarea>
        <button class="ger-obs-save" onclick="saveAlertObs('${a.id}',document.getElementById('obs-${safeId}').value);toast('Observação salva')">Salvar obs.</button>
      </div>
    </div>`
  }).join('')
  const total   = slaAlerts.length
  const nBreach = slaAlerts.filter(a=>a.isBreach).length
  const nWarn   = total - nBreach
  el.innerHTML = `
    <div class="ger-stat-row">
      <div class="ger-stat"><div class="ger-stat-val" style="color:var(--danger)">${nBreach}</div><div class="ger-stat-lbl">SLA Estourado</div></div>
      <div class="ger-stat"><div class="ger-stat-val" style="color:#f59e0b">${nWarn}</div><div class="ger-stat-lbl">Em Alerta</div></div>
      <div class="ger-stat"><div class="ger-stat-val">${total}</div><div class="ger-stat-lbl">Total Registros</div></div>
    </div>
    <div class="ger-section">
      <div class="ger-section-title">Registros de Alerta (${total})</div>
      ${cards}
    </div>`
}

/* ── GERENCIAL: PARADOS ── */
function renderGerParados(el){
  const nowMs = Date.now()
  const items = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const contactName = contact ? contact.name : token
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(s==='concluida') return
      if(!SLA_ACTIVE.has(s)) return
      const changedAt = r.statusChangedAt||r.createdAt||0
      const elapsed   = nowMs - changedAt
      const cfg       = (r.tipo && TIPO_SLA[r.tipo]) || null
      const slaState  = !cfg ? 'ok' : elapsed>=cfg.slaMs?'breach':elapsed>=cfg.alertMs?'warn':'ok'
      items.push({...r, id:reqId, token, contactName, elapsed, slaState, cfg})
    })
  })
  items.sort((a,b)=>b.elapsed-a.elapsed)

  if(!items.length){
    el.innerHTML = `<div class="ger-empty">✅ Nenhum pedido parado no pipeline</div>`
    return
  }
  const fmt = ms => { const m=Math.floor(ms/60000); return m+'min' }
  const cards = items.map((r,i)=>{
    const s = r.status||'em_pedido'
    const fillColor = r.slaState==='breach'?'var(--danger)':r.slaState==='warn'?'#f59e0b':'var(--success)'
    const pct = r.cfg ? Math.min(100,(r.elapsed/r.cfg.slaMs)*100) : 0
    return `<div class="ger-card ${r.slaState}">
      <div class="ger-row">
        <div class="ger-rank">#${i+1}</div>
        <div class="ger-name" style="margin-left:6px">${esc(r.title)}</div>
        <div class="ger-time ${r.slaState}">${fmt(r.elapsed)}</div>
      </div>
      <div class="ger-meta">
        <strong>${STATUS_LABELS[s]||s}</strong> · ${esc(r.contactName)}
        ${r.tipo ? ` · ${TIPO_LABELS[r.tipo]||r.tipo}` : ''}
        ${r.cfg ? ` · SLA ${r.cfg.slaMs/60000}min` : ''}
      </div>
      ${r.cfg ? `<div class="ger-sla-bar"><div class="ger-sla-fill" style="width:${pct}%;background:${fillColor}"></div></div>` : ''}
    </div>`
  }).join('')
  el.innerHTML = `<div class="ger-section"><div class="ger-section-title">Pedidos mais parados (${items.length})</div>${cards}</div>`
}

/* ── GERENCIAL: SEPARAÇÃO ── */
function renderGerSeparacao(el){
  const items = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const contactName = contact ? contact.name : token
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      if(!r.statusHistory) return
      let colMs = 0
      const hist = Array.isArray(r.statusHistory) ? r.statusHistory : []
      for(let i=0;i<hist.length;i++){
        if(hist[i].status==='em_coleta'){
          const start = hist[i].changedAt||0
          const end   = hist[i+1] ? (hist[i+1].changedAt||Date.now()) : Date.now()
          colMs += end - start
        }
      }
      if((r.status||'')==='em_coleta'){
        const start = r.statusChangedAt||0
        if(start) colMs += Date.now() - start
      }
      if(colMs>0) items.push({...r, id:reqId, token, contactName, colMs})
    })
  })
  items.sort((a,b)=>b.colMs-a.colMs)

  if(!items.length){
    el.innerHTML = `<div class="ger-empty">✂️ Nenhum pedido com tempo de separação registrado</div>`
    return
  }
  const fmt = ms => { const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return m>0?`${m}min`:s+'s' }
  const avgMs = items.reduce((acc,r)=>acc+r.colMs,0)/items.length
  const maxMs = items[0].colMs
  const cards = items.map((r,i)=>{
    const pct = Math.min(100,(r.colMs/maxMs)*100)
    return `<div class="ger-card neutral">
      <div class="ger-row">
        <div class="ger-rank">#${i+1}</div>
        <div class="ger-name" style="margin-left:6px">${esc(r.title)}</div>
        <div class="ger-time neutral">${fmt(r.colMs)}</div>
      </div>
      <div class="ger-meta">${esc(r.contactName)}${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}</div>
      <div class="ger-sla-bar"><div class="ger-sla-fill" style="width:${pct}%;background:var(--info)"></div></div>
    </div>`
  }).join('')
  el.innerHTML = `
    <div class="ger-stat-row">
      <div class="ger-stat"><div class="ger-stat-val" style="color:var(--info)">${fmt(maxMs)}</div><div class="ger-stat-lbl">Maior tempo</div></div>
      <div class="ger-stat"><div class="ger-stat-val">${fmt(Math.round(avgMs))}</div><div class="ger-stat-lbl">Média</div></div>
      <div class="ger-stat"><div class="ger-stat-val">${items.length}</div><div class="ger-stat-lbl">Pedidos</div></div>
    </div>
    <div class="ger-section"><div class="ger-section-title">Tempo em Separação (em_coleta)</div>${cards}</div>`
}

/* ── GERENCIAL: SKU ── */
function renderGerSku(el){
  const items = []
  const deviationStatuses = new Set(['validar_alteracao','alterar_pedido'])
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const contactName = contact ? contact.name : token
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      let devMs=0, devCount=0
      const hist = Array.isArray(r.statusHistory) ? r.statusHistory : []
      for(let i=0;i<hist.length;i++){
        if(deviationStatuses.has(hist[i].status)){
          const start=hist[i].changedAt||0
          const end=hist[i+1]?(hist[i+1].changedAt||Date.now()):Date.now()
          devMs+=end-start; devCount++
        }
      }
      if(deviationStatuses.has(r.status||'')){
        const start=r.statusChangedAt||0
        if(start){ devMs+=Date.now()-start; devCount++ }
      }
      if(devMs>0) items.push({...r, id:reqId, token, contactName, devMs, devCount})
    })
  })
  items.sort((a,b)=>b.devMs-a.devMs)

  if(!items.length){
    el.innerHTML = `<div class="ger-empty">🔍 Nenhum pedido com desvio de SKU registrado</div>`
    return
  }
  const fmt = ms => { const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000); return m>0?`${m}min`:s+'s' }
  const avgMs = items.reduce((acc,r)=>acc+r.devMs,0)/items.length
  const maxMs = items[0].devMs
  const totalDev = items.reduce((acc,r)=>acc+r.devCount,0)
  const cards = items.map((r,i)=>{
    const pct = Math.min(100,(r.devMs/maxMs)*100)
    const s = r.status||'em_pedido'
    return `<div class="ger-card neutral">
      <div class="ger-row">
        <div class="ger-rank">#${i+1}</div>
        <div class="ger-name" style="margin-left:6px">${esc(r.title)}</div>
        <div class="ger-time neutral">${fmt(r.devMs)}</div>
      </div>
      <div class="ger-meta">
        ${esc(r.contactName)}${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}
        · <strong>${r.devCount}x desvio</strong>
        · status atual: ${STATUS_LABELS[s]||s}
      </div>
      <div class="ger-sla-bar"><div class="ger-sla-fill" style="width:${pct}%;background:var(--purple)"></div></div>
    </div>`
  }).join('')
  el.innerHTML = `
    <div class="ger-stat-row">
      <div class="ger-stat"><div class="ger-stat-val" style="color:var(--purple)">${fmt(maxMs)}</div><div class="ger-stat-lbl">Maior desvio</div></div>
      <div class="ger-stat"><div class="ger-stat-val">${fmt(Math.round(avgMs))}</div><div class="ger-stat-lbl">Média</div></div>
      <div class="ger-stat"><div class="ger-stat-val">${totalDev}</div><div class="ger-stat-lbl">Total desvios</div></div>
    </div>
    <div class="ger-section"><div class="ger-section-title">Velocidade de SKU — pedidos com desvio</div>${cards}</div>`
}

/* ── SAVE OBS ── */
function saveAlertObs(alertId, obs){
  const rec = slaAlerts.find(a=>a.id===alertId)
  if(rec){
    rec.obs = obs
    S.set('ger_alert_records', slaAlerts)
    if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(slaAlerts)) }catch(e){}
  }
}

/* ── SYNC PIPELINE TO ANDROID ── */
function syncPipelineToAndroid(){
  if(!window.AndroidBridge) return
  const active = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s)||!r.tipo||!TIPO_SLA[r.tipo]) return
      const rawTs = r.statusChangedAt||r.createdAt||0
      const seenKey = reqId+'_'+s
      if(!seenTs[seenKey]) seenTs[seenKey] = Date.now()
      const effectiveChangedAt = rawTs>0 ? rawTs : seenTs[seenKey]
      active.push({ id:reqId, token, title:r.title||reqId, status:s, tipo:r.tipo,
        statusChangedAt: effectiveChangedAt, createdAt: r.createdAt||0 })
    })
  })
  try{ AndroidBridge.savePipelineRequests(JSON.stringify(active)) }catch(e){}
}

/* ── SLA NOTIFICATION CHECK ── */
function checkSlaNotifs(){
  const nowMs = Date.now()
  let changed = false

  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s)||!r.tipo||!TIPO_SLA[r.tipo]) return
      const cfg = TIPO_SLA[r.tipo]; if(!cfg) return

      const rawChangedAt = r.statusChangedAt||r.createdAt||0
      const seenKey = reqId+'_'+s
      if(!seenTs[seenKey]) seenTs[seenKey] = nowMs
      const changedAt = rawChangedAt>0 ? rawChangedAt : seenTs[seenKey]
      const elapsed   = nowMs - changedAt
      const slaKey    = 'sla_'+reqId
      const lastFired = notifTs[slaKey]||0

      if(changedAt>0 && elapsed>=cfg.alertMs && lastFired<changedAt){
        const elMin    = Math.floor(elapsed/60000)
        const slaMin   = cfg.slaMs/60000
        const isBreach = elapsed>=cfg.slaMs
        const icon     = isBreach ? '🔴' : '⚠️'
        const status   = STATUS_LABELS[s]||s
        const tipo     = TIPO_LABELS[r.tipo]||r.tipo
        const timeStr  = fmtTime(Date.now())
        sendNotif(
          `${icon} ${timeStr} — ${isBreach?'SLA Estourado!':'Pedido Parado'}`,
          `"${r.title}" — ${status} há ${elMin}min (${tipo}, SLA: ${slaMin}min)`
        )
        const contact = contacts.find(c=>c.token===token)
        slaAlerts.unshift({
          id: `${Date.now()}_${reqId}`,
          reqId, token, reqTitle: r.title||reqId,
          contactName: contact?contact.name:token,
          tipo: r.tipo, status: s,
          changedAt, firedAt: Date.now(), elapsedMs: elapsed, isBreach, obs: ''
        })
        if(slaAlerts.length>200) slaAlerts = slaAlerts.slice(0,200)
        S.set('ger_alert_records', slaAlerts)
        if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(slaAlerts)) }catch(e){}
        notifTs[slaKey] = changedAt
        changed = true
      }
    })
  })

  if(changed){
    S.set('ger_notif_ts', notifTs)
    if(window.AndroidBridge) try{ AndroidBridge.saveNotifTs(JSON.stringify(notifTs)) }catch(e){}
  }

  // Cleanup seenTs
  const activeKeys = new Set()
  Object.entries(allRequests).forEach(([,reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(r && SLA_ACTIVE.has(r.status||'')) activeKeys.add(reqId+'_'+(r.status||''))
    })
  })
  Object.keys(seenTs).forEach(k=>{ if(!activeKeys.has(k)) delete seenTs[k] })

  // Alert pip
  const nRecent = slaAlerts.filter(a=>Date.now()-a.firedAt<60*60000).length
  const pip = document.getElementById('alertPip')
  if(pip) pip.style.display = nRecent>0?'block':'none'
}

/* ── FIREBASE SUBSCRIPTION ── */
function subscribeData(){
  fbDb.ref('owner/contacts').on('value', snap=>{
    contacts = []
    snap.forEach(child=>{
      const c = child.val()
      if(c && c.token) contacts.push({...c, key: child.key})
    })
    const fbEl = document.getElementById('fbStatus')
    if(fbEl) fbEl.textContent = `${contacts.length} contatos`
    contacts.forEach(c=>subscribeContact(c.token))
    syncPipelineToAndroid()
    checkSlaNotifs()
    renderGerencial()
  })
}

function subscribeContact(token){
  fbDb.ref(`contacts/${token}/requests`).on('value', snap=>{
    allRequests[token] = snap.val()||{}
    syncPipelineToAndroid()
    checkSlaNotifs()
    renderGerencial()
  })
}

/* ── INIT ── */
if(window.AndroidBridge){
  try{ const s=AndroidBridge.getAlertRecords(); if(s&&s!=='[]') slaAlerts=JSON.parse(s) }catch(e){}
  try{ const s=AndroidBridge.getNotifTs(); if(s&&s!=='{}') notifTs=JSON.parse(s) }catch(e){}
}

if(typeof Notification!=='undefined' && Notification.permission==='default'){
  Notification.requestPermission()
}

// Set initial active nav button
document.querySelectorAll('.nav-it')[0].classList.add('on')

subscribeData()
renderGerencial()
setInterval(()=>{ checkSlaNotifs() }, 30000)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkSlaNotifs()
})
</script>
