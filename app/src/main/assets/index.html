<title>Memora Gerencial</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* ── TOKENS — warm notebook dark ── */
:root {
  --bg: #131210; --surface: #1d1b17; --surface-2: #272420; --surface-3: #322f29;
  --border: #3a3730; --border-2: #4a4740;
  --accent: #e8920c; --accent-2: #f0a830;
  --accent-dim: rgba(232,146,12,.13); --accent-dim-2: rgba(232,146,12,.22);
  --text: #f0ece2; --text-2: #c4bfb0; --text-muted: #8a8474; --text-ghost: #5a5650;
  --success: #4ade80; --success-dim: rgba(74,222,128,.14);
  --danger: #f87171;  --danger-dim: rgba(248,113,113,.13);
  --warn: #fbbf24;    --warn-dim: rgba(251,191,36,.13);
  --info: #60a5fa;    --info-dim: rgba(96,165,250,.12);
  --purple: #c084fc;  --purple-dim: rgba(192,132,252,.14);
  --r-sm: 6px; --r: 10px; --r-lg: 14px; --r-xl: 20px;
  --nav-h: 64px; --head-h: 60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #faf8f2; --surface: #fff; --surface-2: #f4f1e8; --surface-3: #ece9dc;
    --border: #e0dace; --border-2: #ccc7b7;
    --accent: #c07600; --accent-2: #d98800;
    --accent-dim: rgba(192,118,0,.1); --accent-dim-2: rgba(192,118,0,.18);
    --text: #1a1714; --text-2: #4a4540; --text-muted: #7a7060; --text-ghost: #b0a898;
    --success: #16a34a; --success-dim: rgba(22,163,74,.12);
    --danger: #dc2626;  --danger-dim: rgba(220,38,38,.1);
    --warn: #d97706;    --warn-dim: rgba(217,119,6,.1);
    --info: #2563eb;    --info-dim: rgba(37,99,235,.1);
    --purple: #9333ea;  --purple-dim: rgba(147,51,234,.12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #faf8f2; --surface: #fff; --surface-2: #f4f1e8; --surface-3: #ece9dc;
  --border: #e0dace; --border-2: #ccc7b7;
  --accent: #c07600; --accent-2: #d98800;
  --accent-dim: rgba(192,118,0,.1); --accent-dim-2: rgba(192,118,0,.18);
  --text: #1a1714; --text-2: #4a4540; --text-muted: #7a7060; --text-ghost: #b0a898;
  --success: #16a34a; --success-dim: rgba(22,163,74,.12);
  --danger: #dc2626;  --danger-dim: rgba(220,38,38,.1);
  --warn: #d97706;    --warn-dim: rgba(217,119,6,.1);
  --info: #2563eb;    --info-dim: rgba(37,99,235,.1);
  --purple: #9333ea;  --purple-dim: rgba(147,51,234,.12);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
html, body { height: 100%; overflow: hidden }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px; line-height: 1.5;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── APP SHELL ── */
#app { display: flex; flex-direction: column; height: 100%; max-width: 640px; margin: 0 auto }

/* ── HEADER ── */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; height: var(--head-h);
  background: var(--bg); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  padding-top: env(safe-area-inset-top, 0px);
  height: calc(var(--head-h) + env(safe-area-inset-top, 0px));
}
.logo {
  font-family: 'Outfit', sans-serif;
  font-size: 17px; font-weight: 800; color: var(--accent);
  letter-spacing: -.4px; display: flex; align-items: center; gap: 9px; flex-shrink: 0;
}
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(232,146,12,.35);
}
.logo-mark svg { width: 17px; height: 17px; color: #fff }
.logo em { color: var(--text); font-style: normal; font-weight: 500; font-size: 15px }
#fbStatus { font-size: 11px; color: var(--text-ghost); font-family: 'DM Sans', sans-serif }

/* ── CONTENT / TABS ── */
.main { flex: 1; overflow: hidden; position: relative }
.tab {
  display: none; flex-direction: column;
  height: 100%; overflow-y: auto;
  padding-bottom: calc(var(--nav-h) + 8px);
}
.tab.on { display: flex }
.tab::-webkit-scrollbar { width: 3px }
.tab::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px }

/* ── BOTTOM NAV ── */
.bot-nav {
  display: flex; height: var(--nav-h);
  background: var(--surface); border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  flex-shrink: 0;
}
.nav-it {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text-muted);
  transition: color .15s; border: none; background: none;
  padding: 8px 4px; font-family: 'DM Sans', sans-serif; position: relative;
}
.nav-it.on { color: var(--accent) }
.nav-it svg { width: 22px; height: 22px }
.nav-label { font-size: 11px; font-weight: 500 }
.nav-badge {
  min-width: 16px; height: 16px; border-radius: 8px;
  background: var(--danger); color: #fff;
  font-size: 10px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
  padding: 0 4px; margin-top: -2px;
}

/* ── SECTION HEADER ── */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 16px 10px; flex-shrink: 0; flex-wrap: wrap; gap: 8px;
}
.sec-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.4px;
}
.refresh-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 100px;
  border: 1px solid var(--border-2); background: var(--surface-2);
  color: var(--text-muted); font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all .15s;
}
.refresh-btn:hover { border-color: var(--accent); color: var(--accent) }

/* ── STAT TILES ── */
.stat-row { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap }
.stat-card {
  flex: 1 1 auto; min-width: 0; padding: 11px 13px;
  border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--border);
}
.stat-val {
  font-family: 'Outfit', sans-serif;
  font-size: 28px; font-weight: 800; color: var(--accent);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px }

/* ── GROUPS ── */
.sec-group { margin-bottom: 16px }
.sec-label {
  font-size: 11px; font-weight: 600; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-muted);
  padding: 0 16px 8px;
}
.empty-state {
  text-align: center; padding: 52px 24px;
  color: var(--text-muted); font-size: 14px; line-height: 1.6;
}

/* ── CARDS ── */
.card {
  margin: 0 16px 8px; padding: 13px 14px;
  border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--border-2);
  transition: border-color .15s;
}
.card.ok     { border-left-color: var(--success) }
.card.warn   { border-left-color: var(--warn);   background: var(--surface) }
.card.breach { border-left-color: var(--danger);  background: var(--surface) }
.card.info   { border-left-color: var(--info) }
.card.purple { border-left-color: var(--purple) }
.card-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px }
.card-name {
  font-size: 14px; font-weight: 600; color: var(--text);
  flex: 1; min-width: 0; word-break: break-word;
}
.card-time { font-size: 13px; font-weight: 700; flex-shrink: 0; font-variant-numeric: tabular-nums }
.card-time.ok     { color: var(--success) }
.card-time.warn   { color: var(--warn) }
.card-time.breach { color: var(--danger) }
.card-time.info   { color: var(--info) }
.card-time.purple { color: var(--purple) }
.card-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.5 }
.card-notif { font-size: 11px; color: var(--text-ghost); margin-top: 3px }
.sla-bar { height: 3px; border-radius: 2px; background: var(--surface-2); margin-top: 9px; overflow: hidden }
.sla-fill { height: 100%; border-radius: 2px; transition: width .3s }
.rank {
  font-family: 'Outfit', sans-serif;
  font-size: 18px; font-weight: 800;
  color: var(--text-muted); flex-shrink: 0; min-width: 24px;
}

/* ── OBS FIELD ── */
.obs-wrap { margin-top: 10px }
.obs-label {
  font-size: 10px; font-weight: 700; letter-spacing: .07em;
  text-transform: uppercase; color: var(--text-ghost); margin-bottom: 5px;
}
.obs-ta {
  width: 100%; padding: 8px 10px;
  border: 1.5px solid var(--border); border-radius: var(--r);
  background: var(--surface-2); color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 13px; line-height: 1.4; resize: vertical; min-height: 52px;
  outline: none; transition: border-color .15s;
}
.obs-ta:focus { border-color: var(--accent) }
.obs-save {
  margin-top: 6px; padding: 5px 14px; border-radius: 100px;
  border: 1.5px solid var(--accent); background: var(--accent-dim);
  color: var(--accent); font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: all .15s;
}
.obs-save:hover { background: var(--accent-dim-2) }

/* ── ANIMATIONS ── */
@keyframes pulse-sla {
  0%,100% { opacity: 1 } 50% { opacity: .65 }
}
.card.warn   { animation: pulse-sla 1.8s ease-in-out infinite }
.card.breach { animation: pulse-sla 0.9s ease-in-out infinite }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.1/firebase-database-compat.min.js"></script>
<script>
'use strict'

/* ── FIREBASE ── */
const firebaseConfig = {
  apiKey: "AIzaSyArRSR87rQzOM5qQCVMA5RUdhumCY71P6c",
  authDomain: "memo-build.firebaseapp.com",
  databaseURL: "https://memo-build-default-rtdb.firebaseio.com",
  storageBucket: "memo-build.firebasestorage.app"
}
const fbApp = firebase.initializeApp(firebaseConfig)
const fbDb  = firebase.database()

/* ── STORAGE ── */
const S = {
  get(k, def) { try { const v=localStorage.getItem(k); return v===null?def:JSON.parse(v) } catch(e){ return def } },
  set(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
}

/* ── SLA CONFIG ── */
const TIPO_LABELS = {
  urg1_retira:       '🚀 Ret. Urg.1',
  nao_em_loja:       '🏪 Não em Loja',
  entrega_2h:        '⚡ Entrega 2h',
  entrega_dia:       '📦 Entrega Dia',
  entrega_outro_dia: '🗓️ Outro Dia'
}
const TIPO_SLA = {
  urg1_retira:       { alertMs:  5*60000, slaMs: 10*60000 },
  nao_em_loja:       { alertMs:  5*60000, slaMs: 10*60000 },
  entrega_2h:        { alertMs: 10*60000, slaMs: 20*60000 },
  entrega_dia:       { alertMs: 10*60000, slaMs: 20*60000 },
  entrega_outro_dia: null
}
const STATUS_LABELS = {
  em_pedido:'Em Pedido', pedido_pronto:'Pedido Pronto', em_coleta:'Em Coleta',
  validar_alteracao:'Validar Alteração', alterar_pedido:'Alterar Pedido',
  coletado:'Coletado', em_expedicao:'Em Expedição', concluida:'Concluída'
}
const SLA_ACTIVE = new Set(['pedido_pronto','em_coleta','validar_alteracao','alterar_pedido','em_expedicao'])

/* ── STATE ── */
let allRequests  = {}   // token → { reqId → req }
let contacts     = []
let notifTs      = S.get('ger_notif_ts', {})
let alertRecords = S.get('ger_alert_records', [])
let curTab       = 'alertas'
let seenTs       = {}   // 'reqId_status' → timestamp quando vimos pela primeira vez nesse status

/* ── HELPERS ── */
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
const fmtMs = ms => { const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000); return m>0?`${m}min`:s+'s' }
const fmtTime = ts => new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})

function sendNotif(title, body) {
  if (window.AndroidBridge) { try { AndroidBridge.showNotification(title, body) } catch(e){} }
  else if (typeof Notification !== 'undefined' && Notification.permission === 'granted') {
    new Notification(title, { body })
  }
}

/* ── NAVIGATION ── */
function goTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'))
  document.querySelectorAll('.nav-it').forEach(b=>b.classList.remove('on'))
  document.getElementById('tab-'+name).classList.add('on')
  if(btn) btn.classList.add('on')
  curTab = name
  if(name==='alertas')   renderAlertas()
  if(name==='dashboard') renderDashboard()
  if(name==='historico') renderHistorico()
}

/* ── FIREBASE SUBSCRIPTION ── */
function subscribeData() {
  // Subscribe to owner contacts list
  fbDb.ref('owner/contacts').on('value', snap => {
    contacts = []
    snap.forEach(child => {
      const c = child.val()
      if(c && c.token) contacts.push({...c, key: child.key})
    })
    document.getElementById('fbStatus').textContent = `${contacts.length} contatos`
    contacts.forEach(c => subscribeContact(c.token))
    syncPipelineToAndroid()
    checkSlaNotifs()
    if(curTab==='alertas')   renderAlertas()
    if(curTab==='dashboard') renderDashboard()
    if(curTab==='historico') renderHistorico()
  })
}

function subscribeContact(token) {
  fbDb.ref(`contacts/${token}/requests`).on('value', snap => {
    const reqs = snap.val()
    allRequests[token] = reqs || {}
    syncPipelineToAndroid()
    checkSlaNotifs()
    if(curTab==='alertas')   renderAlertas()
    if(curTab==='dashboard') renderDashboard()
    if(curTab==='historico') renderHistorico()
  })
}

/* ── SYNC PIPELINE TO ANDROID ── */
function syncPipelineToAndroid() {
  if(!window.AndroidBridge) return
  const active = []
  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s) || !r.tipo || !TIPO_SLA[r.tipo]) return
      const rawTs = r.statusChangedAt||r.createdAt||0
      const seenKey = reqId+'_'+s
      if(!seenTs[seenKey]) seenTs[seenKey] = Date.now()
      const effectiveChangedAt = rawTs > 0 ? rawTs : seenTs[seenKey]
      active.push({ id:reqId, token, title:r.title||reqId, status:s, tipo:r.tipo,
        statusChangedAt: effectiveChangedAt, createdAt: r.createdAt||0 })
    })
  })
  try { AndroidBridge.savePipelineRequests(JSON.stringify(active)) } catch(e){}
}

/* ── SLA NOTIFICATION CHECK ── */
function checkSlaNotifs() {
  const nowMs = Date.now()
  let changed = false

  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s) || !r.tipo || !TIPO_SLA[r.tipo]) return
      const cfg = TIPO_SLA[r.tipo]; if(!cfg) return

      const rawChangedAt = r.statusChangedAt||r.createdAt||0
      const seenKey2 = reqId+'_'+s
      if(!seenTs[seenKey2]) seenTs[seenKey2] = nowMs
      const changedAt = rawChangedAt > 0 ? rawChangedAt : seenTs[seenKey2]
      const elapsed   = nowMs - changedAt
      const slaKey    = 'sla_'+reqId
      const lastFired = notifTs[slaKey]||0

      if(changedAt > 0 && elapsed >= cfg.alertMs && lastFired < changedAt) {
        const elMin    = Math.floor(elapsed/60000)
        const slaMin   = cfg.slaMs/60000
        const isBreach = elapsed >= cfg.slaMs
        const icon     = isBreach ? '🔴' : '⚠️'
        const status   = STATUS_LABELS[s]||s
        const tipo     = TIPO_LABELS[r.tipo]||r.tipo
        const timeStr  = fmtTime(Date.now())
        sendNotif(
          `${icon} ${timeStr} — ${isBreach?'SLA Estourado!':'Pedido Parado'}`,
          `"${r.title}" — ${status} há ${elMin}min (${tipo}, SLA: ${slaMin}min)`
        )
        // Save alert record
        const contact = contacts.find(c=>c.token===token)
        alertRecords.unshift({
          id: `${Date.now()}_${reqId}`,
          reqId, token, reqTitle: r.title||reqId,
          contactName: contact?contact.name:token,
          tipo: r.tipo, status: s,
          changedAt, firedAt: Date.now(), elapsedMs: elapsed, isBreach, obs: ''
        })
        if(alertRecords.length > 200) alertRecords = alertRecords.slice(0,200)
        S.set('ger_alert_records', alertRecords)
        if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(alertRecords)) }catch(e){}

        notifTs[slaKey] = changedAt
        changed = true
      }
    })
  })

  if(changed) {
    S.set('ger_notif_ts', notifTs)
    if(window.AndroidBridge) try{ AndroidBridge.saveNotifTs(JSON.stringify(notifTs)) }catch(e){}
  }

  // Limpar seenTs de pedidos que não estão mais ativos (evitar memory leak)
  const activeKeys = new Set()
  Object.entries(allRequests).forEach(([,reqs]) => {
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(r && SLA_ACTIVE.has(r.status||'')) activeKeys.add(reqId+'_'+(r.status||''))
    })
  })
  Object.keys(seenTs).forEach(k => { if(!activeKeys.has(k)) delete seenTs[k] })

  // Badge
  const nAlert = Object.values(alertRecords).filter(a => {
    // only alerts fired in the last 60 min
    return Date.now() - a.firedAt < 60*60000
  }).length
  const badge = document.getElementById('alertBadge')
  if(badge) badge.style.display = nAlert>0 ? 'block' : 'none'
}

/* ── SAVE OBS ── */
function saveObs(alertId, obs) {
  const rec = alertRecords.find(a=>a.id===alertId)
  if(rec) {
    rec.obs = obs
    S.set('ger_alert_records', alertRecords)
    if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(alertRecords)) }catch(e){}
  }
}

/* ══════════════════════════════════
   RENDER: ALERTAS
══════════════════════════════════ */
function renderAlertas() {
  const el = document.getElementById('alertasList')
  if(!el) return

  if(!alertRecords.length) {
    el.innerHTML = `<div class="empty-state">🔔 Nenhum alerta registrado ainda.<br><small>Os alertas aparecem aqui quando pedidos ultrapassam o tempo SLA.</small></div>`
    return
  }

  const nBreach = alertRecords.filter(a=>a.isBreach).length
  const nWarn   = alertRecords.length - nBreach
  const nObs    = alertRecords.filter(a=>a.obs&&a.obs.trim()).length

  const cards = alertRecords.map(a => {
    const cls  = a.isBreach ? 'breach' : 'warn'
    const icon = a.isBreach ? '🔴' : '⚠️'
    const slaMin = (a.tipo&&TIPO_SLA[a.tipo]) ? TIPO_SLA[a.tipo].slaMs/60000 : null
    const safeId = a.id.replace(/[^a-zA-Z0-9_]/g,'_')
    return `<div class="card ${cls}">
      <div class="card-row">
        <div class="card-name">${icon} ${esc(a.reqTitle)}</div>
        <div class="card-time ${cls}">${fmtMs(a.elapsedMs)}</div>
      </div>
      <div class="card-meta">
        <strong>${STATUS_LABELS[a.status]||a.status}</strong> · ${esc(a.contactName)}
        ${a.tipo ? ` · ${TIPO_LABELS[a.tipo]||a.tipo}` : ''}
        ${slaMin ? ` · SLA ${slaMin}min` : ''}
      </div>
      <div class="card-notif">🔔 ${fmtDate(a.firedAt)} às ${fmtTime(a.firedAt)}</div>
      <div class="obs-wrap">
        <div class="obs-label">Observação / Justificativa</div>
        <textarea class="obs-ta" id="obs-${safeId}" rows="2"
          placeholder="Ex: separador estava em outro pedido, falta de peça…">${esc(a.obs||'')}</textarea>
        <button class="obs-save"
          onclick="saveObs('${a.id}',document.getElementById('obs-${safeId}').value);this.textContent='✓ Salvo!'">
          Salvar obs.
        </button>
      </div>
    </div>`
  }).join('')

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--danger)">${nBreach}</div><div class="stat-lbl">Estourados</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--warn)">${nWarn}</div><div class="stat-lbl">Alertas</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--success)">${nObs}</div><div class="stat-lbl">Justificados</div></div>
    </div>
    <div class="sec-group">
      <div class="sec-label">Registros (${alertRecords.length})</div>
      ${cards}
    </div>`
}

/* ══════════════════════════════════
   RENDER: DASHBOARD
══════════════════════════════════ */
function renderDashboard() {
  const el = document.getElementById('dashContent')
  if(!el) return
  const nowMs = Date.now()

  // Gather all active pipeline items
  const active = []
  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const cName   = contact?contact.name:token
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      const s = r.status||'em_pedido'
      if(s==='concluida') return
      active.push({...r, id:reqId, token, cName})
    })
  })

  // ── Parados (SLA active statuses sorted by elapsed) ──
  const parados = active
    .filter(r => SLA_ACTIVE.has(r.status||'em_pedido'))
    .map(r => {
      const elapsed = nowMs - (r.statusChangedAt||r.createdAt||0)
      const cfg = (r.tipo&&TIPO_SLA[r.tipo])||null
      const state = !cfg ? 'ok' : elapsed>=cfg.slaMs?'breach':elapsed>=cfg.alertMs?'warn':'ok'
      return {...r, elapsed, cfg, state}
    })
    .sort((a,b)=>b.elapsed-a.elapsed)

  // ── Separação (time in em_coleta) ──
  const separacao = []
  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const cName   = contact?contact.name:token
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      let ms = 0
      const hist = Array.isArray(r.statusHistory)?r.statusHistory:[]
      for(let i=0;i<hist.length;i++) {
        if(hist[i].status==='em_coleta') {
          const start=hist[i].changedAt||0, end=hist[i+1]?(hist[i+1].changedAt||nowMs):nowMs
          ms += end-start
        }
      }
      if((r.status||'')==='em_coleta') { const s=r.statusChangedAt||0; if(s) ms+=nowMs-s }
      if(ms>0) separacao.push({...r,id:reqId,token,cName,colMs:ms})
    })
  })
  separacao.sort((a,b)=>b.colMs-a.colMs)

  // ── SKU (desvio times) ──
  const skuItems = []
  const devSet = new Set(['validar_alteracao','alterar_pedido'])
  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const cName   = contact?contact.name:token
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      let ms=0, ct=0
      const hist=Array.isArray(r.statusHistory)?r.statusHistory:[]
      for(let i=0;i<hist.length;i++) {
        if(devSet.has(hist[i].status)) {
          const start=hist[i].changedAt||0, end=hist[i+1]?(hist[i+1].changedAt||nowMs):nowMs
          ms+=end-start; ct++
        }
      }
      if(devSet.has(r.status||'')) { const s=r.statusChangedAt||0; if(s){ ms+=nowMs-s; ct++ } }
      if(ms>0) skuItems.push({...r,id:reqId,token,cName,devMs:ms,devCount:ct})
    })
  })
  skuItems.sort((a,b)=>b.devMs-a.devMs)

  // ── Stats ──
  const nBreach = parados.filter(r=>r.state==='breach').length
  const nWarn   = parados.filter(r=>r.state==='warn').length
  const avgSep  = separacao.length ? Math.round(separacao.reduce((acc,r)=>acc+r.colMs,0)/separacao.length) : 0
  const avgSku  = skuItems.length  ? Math.round(skuItems.reduce((acc,r)=>acc+r.devMs,0)/skuItems.length) : 0

  const renderParadoCard = (r, i) => {
    const s = r.status||'em_pedido'
    const fillColor = r.state==='breach'?'var(--danger)':r.state==='warn'?'var(--warn)':'var(--success)'
    const pct = r.cfg ? Math.min(100,(r.elapsed/r.cfg.slaMs)*100) : 0
    return `<div class="card ${r.state}">
      <div class="card-row">
        <div class="rank">#${i+1}</div>
        <div class="card-name" style="margin-left:6px">${esc(r.title)}</div>
        <div class="card-time ${r.state}">${fmtMs(r.elapsed)}</div>
      </div>
      <div class="card-meta">
        <strong>${STATUS_LABELS[s]||s}</strong> · ${esc(r.cName)}
        ${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}
        ${r.cfg?` · SLA ${r.cfg.slaMs/60000}min`:''}
      </div>
      ${r.cfg?`<div class="sla-bar"><div class="sla-fill" style="width:${pct}%;background:${fillColor}"></div></div>`:''}
    </div>`
  }

  const renderSepCard = (r, i) => `<div class="card info">
    <div class="card-row">
      <div class="rank">#${i+1}</div>
      <div class="card-name" style="margin-left:6px">${esc(r.title)}</div>
      <div class="card-time info">${fmtMs(r.colMs)}</div>
    </div>
    <div class="card-meta">${esc(r.cName)}${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}</div>
    <div class="sla-bar"><div class="sla-fill" style="width:${Math.min(100,(r.colMs/(separacao[0]?.colMs||1))*100)}%;background:var(--info)"></div></div>
  </div>`

  const renderSkuCard = (r, i) => {
    const s = r.status||'em_pedido'
    return `<div class="card purple">
      <div class="card-row">
        <div class="rank">#${i+1}</div>
        <div class="card-name" style="margin-left:6px">${esc(r.title)}</div>
        <div class="card-time purple">${fmtMs(r.devMs)}</div>
      </div>
      <div class="card-meta">
        ${esc(r.cName)}${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}
        · <strong>${r.devCount}x desvio</strong> · ${STATUS_LABELS[s]||s}
      </div>
      <div class="sla-bar"><div class="sla-fill" style="width:${Math.min(100,(r.devMs/(skuItems[0]?.devMs||1))*100)}%;background:var(--purple)"></div></div>
    </div>`
  }

  const section = (title, list, fn) => list.length ? `
    <div class="sec-group">
      <div class="sec-label">${title} (${list.length})</div>
      ${list.slice(0,10).map(fn).join('')}
    </div>` : ''

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--danger)">${nBreach}</div><div class="stat-lbl">SLA Estourado</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--warn)">${nWarn}</div><div class="stat-lbl">Em Alerta</div></div>
      <div class="stat-card"><div class="stat-val">${active.length}</div><div class="stat-lbl">Em Andamento</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--info)">${avgSep?fmtMs(avgSep):'—'}</div><div class="stat-lbl">Média Separação</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--purple)">${avgSku?fmtMs(avgSku):'—'}</div><div class="stat-lbl">Média Desvio SKU</div></div>
    </div>
    ${section('⏸ Mais Parados', parados, renderParadoCard)}
    ${section('✂️ Maior Tempo em Separação', separacao.slice(0,5), renderSepCard)}
    ${section('🔍 Maior Desvio SKU', skuItems.slice(0,5), renderSkuCard)}
    ${!active.length?'<div class="empty-state">✅ Nenhum pedido ativo no momento</div>':''}`
}

/* ══════════════════════════════════
   RENDER: HISTÓRICO
══════════════════════════════════ */
function renderHistorico() {
  const el = document.getElementById('histContent')
  if(!el) return
  const nowMs = Date.now()

  const done = []
  Object.entries(allRequests).forEach(([token, reqs]) => {
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const cName   = contact?contact.name:token
    Object.entries(reqs).forEach(([reqId, r]) => {
      if(!r) return
      if((r.status||'')==='concluida') {
        // Total time: from createdAt to last statusHistory entry or statusChangedAt
        const hist = Array.isArray(r.statusHistory)?r.statusHistory:[]
        const endTs = r.statusChangedAt || (hist.length?hist[hist.length-1].changedAt:0) || 0
        const start = r.createdAt||0
        const totalMs = endTs&&start ? endTs-start : 0

        // Time in each stage
        let colMs=0, devMs=0, devCount=0
        const devSet = new Set(['validar_alteracao','alterar_pedido'])
        for(let i=0;i<hist.length;i++){
          const s=hist[i].status, t0=hist[i].changedAt||0
          const t1=hist[i+1]?(hist[i+1].changedAt||endTs):endTs
          if(s==='em_coleta') colMs+=t1-t0
          if(devSet.has(s)){ devMs+=t1-t0; devCount++ }
        }
        done.push({...r,id:reqId,token,cName,totalMs,colMs,devMs,devCount,endTs})
      }
    })
  })
  done.sort((a,b)=>(b.endTs||0)-(a.endTs||0))

  if(!done.length){
    el.innerHTML = `<div class="empty-state">📦 Nenhum pedido concluído ainda</div>`
    return
  }

  const avgTotal = done.reduce((acc,r)=>acc+r.totalMs,0)/done.length
  const avgCol   = done.filter(r=>r.colMs>0).reduce((acc,r)=>acc+r.colMs,0)/(done.filter(r=>r.colMs>0).length||1)
  const nDev     = done.filter(r=>r.devCount>0).length

  const cards = done.map(r => {
    const hist = Array.isArray(r.statusHistory)?r.statusHistory:[]
    const histHtml = hist.map(h=>`<span style="color:var(--text-muted)">${STATUS_LABELS[h.status]||h.status}</span>`).join(' → ')
    return `<div class="card ok">
      <div class="card-row">
        <div class="card-name">✅ ${esc(r.title)}</div>
        <div class="card-time ok">${r.totalMs?fmtMs(r.totalMs):'?'}</div>
      </div>
      <div class="card-meta">
        ${esc(r.cName)}${r.tipo?` · ${TIPO_LABELS[r.tipo]||r.tipo}`:''}
        ${r.endTs?` · Concluído ${fmtDate(r.endTs)} ${fmtTime(r.endTs)}`:''}
      </div>
      <div class="card-meta" style="margin-top:4px">
        ${r.colMs?`✂️ Separação: ${fmtMs(r.colMs)}`:''}
        ${r.devCount?`  🔍 Desvios: ${r.devCount}x (${fmtMs(r.devMs)})`:''}
      </div>
      ${histHtml?`<div class="card-meta" style="margin-top:4px;font-size:10px">${histHtml}</div>`:''}
    </div>`
  }).join('')

  el.innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--success)">${done.length}</div><div class="stat-lbl">Concluídos</div></div>
      <div class="stat-card"><div class="stat-val">${avgTotal?fmtMs(Math.round(avgTotal)):'—'}</div><div class="stat-lbl">Tempo Médio</div></div>
      <div class="stat-card"><div class="stat-val" style="color:var(--danger)">${nDev}</div><div class="stat-lbl">Com Desvio</div></div>
    </div>
    <div class="stat-row">
      <div class="stat-card"><div class="stat-val" style="color:var(--info)">${avgCol?fmtMs(Math.round(avgCol)):'—'}</div><div class="stat-lbl">Média Separação</div></div>
    </div>
    <div class="sec-group">
      <div class="sec-label">Pedidos Concluídos (${done.length})</div>
      ${cards}
    </div>`
}
