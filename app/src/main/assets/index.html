<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memora Gerencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ─────────────────────────────────────────────────────
   DESIGN TOKENS — copied from the Torque web panel
   (atacado.fmtorque.com.br, Ant Design theme: Inter 13px,
   primary #d80001, light by default, light/dark toggle)
   ───────────────────────────────────────────────────── */
:root {
  --primary: #d80001;
  --primary-hover: #a50001;
  --primary-text: #d80001;
  --primary-bg: rgba(216,0,1,.06);
  --bg: #f5f0ef;
  --surface: #ffffff;
  --surface-2: #faf5f5;
  --border: #d9d9d9;
  --border-red: rgba(216,0,1,.15);
  --card-border: rgba(216,0,1,.15);
  --text: rgba(0,0,0,.88);
  --text-2: rgba(0,0,0,.65);
  --text-muted: rgba(0,0,0,.62);
  --text-ghost: rgba(0,0,0,.45);
  --header-bg: rgba(255,255,255,.85);
  --shadow: 0 1px 6px rgba(216,0,1,.08);
  --shadow-2: 0 2px 12px rgba(216,0,1,.06);
  /* card left edge / bar colors (Ant Design base palette) */
  --edge-default: #d9d9d9;
  --edge-ok: #52c41a;
  --edge-warn: #faad14;
  --edge-breach: #ff4d4f;
  --edge-info: #1890ff;
  /* tag presets: text / fill / border */
  --t-default-fg: rgba(0,0,0,.88); --t-default-bg: #fafafa; --t-default-bd: #d9d9d9;
  --t-blue-fg: #0958d9;    --t-blue-bg: #e6f4ff;    --t-blue-bd: #91caff;
  --t-proc-fg: #0958d9;    --t-proc-bg: #e6f4ff;    --t-proc-bd: #91caff;
  --t-gold-fg: #d48806;    --t-gold-bg: #fffbe6;    --t-gold-bd: #ffe58f;
  --t-warn-fg: #E8B800;    --t-warn-bg: #fffee6;    --t-warn-bd: #fff58f;
  --t-ok-fg: #389e0d;      --t-ok-bg: #f6ffed;      --t-ok-bd: #b7eb8f;
  --t-err-fg: #cf1322;     --t-err-bg: #fff1f0;     --t-err-bd: #ffa39e;
  --t-volcano-fg: #d4380d; --t-volcano-bg: #fff2e8; --t-volcano-bd: #ffbb96;
  --t-cyan-fg: #08979c;    --t-cyan-bg: #e6fffb;    --t-cyan-bd: #87e8de;
  --r-sm: 4px; --r: 8px; --r-lg: 12px;
  --nav-h: 60px;
  --head-h: 64px;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --primary-text: #ff7875;
  --primary-hover: #ffa39e;
  --primary-bg: rgba(216,0,1,.10);
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1a1a1a;
  --border: #424242;
  --border-red: rgba(216,0,1,.25);
  --card-border: rgba(216,0,1,.2);
  --text: rgba(255,255,255,.85);
  --text-2: rgba(255,255,255,.65);
  --text-muted: rgba(255,255,255,.68);
  --text-ghost: rgba(255,255,255,.45);
  --header-bg: rgba(20,20,20,.85);
  --shadow: 0 2px 12px rgba(0,0,0,.30);
  --shadow-2: 0 4px 20px rgba(0,0,0,.40);
  --t-default-fg: rgba(255,255,255,.85); --t-default-bg: #1d1d1d; --t-default-bd: #424242;
  --t-blue-fg: #3c89e8;    --t-blue-bg: #111a2c;    --t-blue-bd: #15325b;
  --t-proc-fg: #0b4ebb;    --t-proc-bg: #111826;    --t-proc-bd: #11284f;
  --t-gold-fg: #d89614;    --t-gold-bg: #2b2111;    --t-gold-bd: #594214;
  --t-warn-fg: #c89f03;    --t-warn-bg: #282211;    --t-warn-bd: #54450e;
  --t-ok-fg: #33890e;      --t-ok-bg: #141d11;      --t-ok-bd: #1f3d12;
  --t-err-fg: #dc4446;     --t-err-bg: #2c1618;     --t-err-bd: #5b2526;
  --t-volcano-fg: #e87040; --t-volcano-bg: #2b1611; --t-volcano-bd: #592716;
  --t-cyan-fg: #13a8a8;    --t-cyan-bg: #112123;    --t-cyan-bd: #144848;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 13px; line-height: 1.6154;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* Layout: Torque sidebar on the left, top bar + page on the right */
#app { display: flex; height: 100%; position: relative }
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100% }

/* ── SIDEBAR (Torque Sider + Menu) ── */
:root { --sider-w: 220px; --sider-w-min: 64px; --sider-bg: #ffffff }
:root[data-theme="dark"] { --sider-bg: #141414 }
.sider {
  width: var(--sider-w); flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--sider-bg); border-right: 1px solid var(--border-red);
  transition: width .2s; z-index: 30; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sider.collapsed { width: var(--sider-w-min) }
.sider-logo { height: var(--head-h); display: flex; align-items: center; gap: 10px; padding: 0 16px; flex-shrink: 0; white-space: nowrap }
.sider-title { font-size: 15px; font-weight: 600; color: var(--text) }
.sider-title em { color: var(--primary-text); font-style: normal }
.sider-menu { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px; display: flex; flex-direction: column; gap: 4px }
.menu-it {
  position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 40px; padding: 0 16px;
  border: 0; border-radius: var(--r); background: none; color: var(--text);
  font: 400 14px 'Inter', 'Segoe UI', system-ui, sans-serif; text-align: left; white-space: nowrap; cursor: pointer;
  transition: color .2s, background .2s;
}
.menu-it svg { width: 16px; height: 16px; flex-shrink: 0 }
.menu-it:hover { color: var(--primary-text); background: rgba(216,0,1,.04) }
:root[data-theme="dark"] .menu-it:hover { background: rgba(216,0,1,.06) }
.menu-it.on { color: var(--primary-text); background: rgba(216,0,1,.06); box-shadow: inset 3px 0 0 var(--primary) }
:root[data-theme="dark"] .menu-it.on { background: rgba(216,0,1,.10) }
.menu-it .nav-pip { position: absolute; left: 26px; top: 9px }
.sider.collapsed .menu-it { justify-content: center; padding: 0 }
.sider.collapsed .menu-label, .sider.collapsed .sider-title { display: none }
.sider.collapsed .sider-logo { justify-content: center; padding: 0 }
.sider.collapsed .menu-it .nav-pip { left: auto; right: 14px }
.sider-toggle {
  height: 48px; flex-shrink: 0; border: 0; border-top: 1px solid var(--border-red); background: none;
  color: var(--primary-text); display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.sider-toggle svg { width: 16px; height: 16px; transition: transform .2s }
.sider.collapsed .sider-toggle svg { transform: rotate(180deg) }
.sider-mask { display: none }
/* phones: the collapsed bar keeps its place; opened, it slides over the page */
@media (max-width: 700px) {
  .sider { position: absolute; top: 0; bottom: 0; left: 0; box-shadow: 6px 0 16px rgba(0,0,0,.2) }
  .sider.collapsed { box-shadow: none }
  .content { margin-left: var(--sider-w-min) }
  .sider:not(.collapsed) + .sider-mask { display: block; position: absolute; inset: 0; z-index: 25; background: rgba(0,0,0,.45) }
}

/* ── HEADER (Torque top bar) ── */
.hdr {
  display: flex; align-items: center;
  justify-content: space-between; gap: 8px;
  padding: 0 16px; height: var(--head-h);
  background: var(--header-bg);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-red);
  flex-shrink: 0;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
}
.logo {
  font-size: 15px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}
.logo-mark { width: 32px; height: 32px; border-radius: var(--r); overflow: hidden; flex-shrink: 0; background: var(--primary) }
.logo-mark { display: flex; align-items: center; justify-content: center }
.logo-mark svg { width: 20px; height: 20px }
.logo em { color: var(--primary-text); font-style: normal; font-weight: 600 }
.hdr-btns { display: flex; gap: 4px; align-items: center; min-width: 0 }
.hdr-status { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text-ghost); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.icn-btn {
  width: 32px; height: 32px; border-radius: var(--r);
  border: 0; background: transparent; color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .2s; flex-shrink: 0;
}
.icn-btn:hover { background: rgba(0,0,0,.06) }
:root[data-theme="dark"] .icn-btn:hover { background: rgba(255,255,255,.08) }
.icn-btn:active { background: rgba(0,0,0,.15) }

/* ── CONTENT ── */
.main { flex: 1; overflow: hidden; position: relative }
.tab {
  display: none; flex-direction: column;
  height: 100%; overflow-y: auto;
  padding-bottom: 12px;  /* the bottom nav sits below .main, not over it */
}
.tab.on { display: flex }
.tab::-webkit-scrollbar { width: 6px }
.tab::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px }

/* ── PAGE TITLE (Torque h2) ── */
.sec-head {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 20px 16px 12px;
  flex-shrink: 0; flex-wrap: wrap; gap: 8px;
}
.sec-title { font-size: 28px; line-height: 36px; font-weight: 600; color: var(--text) }

/* ── BUTTONS (Ant Design, Torque overrides: radius 8, weight 600) ── */
.add-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 32px; padding: 4px 15px;
  background: var(--primary); color: #fff;
  border: 1px solid transparent; border-radius: var(--r);
  font: 600 13px/1 'Inter', 'Segoe UI', system-ui, sans-serif;
  box-shadow: 0 2px 0 rgba(216,0,1,.1);
  cursor: pointer; transition: background .2s;
  white-space: nowrap; flex-shrink: 0;
}
.add-btn:hover { background: var(--primary-hover) }
.add-btn:active { background: #7a0001 }
.add-btn svg { width: 14px; height: 14px }
.add-btn:disabled { opacity: .6; cursor: default }

/* ── TOASTS (Ant Design message) ── */
.toasts {
  position: fixed;
  top: calc(var(--head-h) + 8px + env(safe-area-inset-top, 0px));
  left: 50%; transform: translateX(-50%);
  z-index: 300; display: flex; flex-direction: column; align-items: center;
  gap: 8px; pointer-events: none;
  width: min(calc(100% - 32px), 400px);
}
.toast {
  background: var(--surface); color: var(--text);
  border-radius: var(--r); padding: 9px 12px;
  font-size: 13px;
  box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  animation: tin .2s ease-out forwards;
  pointer-events: all;
}
@keyframes tin { from { opacity:0; transform:translateY(-8px) } to { opacity:1; transform:none } }

/* ── TABS (Ant Design Tabs, Torque ink bar) ── */
.ger-tabs { display: flex; border-bottom: 1px solid var(--border-red); margin: 0 16px 16px; gap: 24px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; flex-shrink: 0 }
.ger-tabs::-webkit-scrollbar { display: none }
.ger-tab-btn {
  padding: 10px 0; font-size: 13px; font-weight: 400;
  color: var(--text); background: none; border: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  cursor: pointer; font-family: inherit; transition: color .2s; white-space: nowrap;
}
.ger-tab-btn:hover { color: var(--primary-hover) }
.ger-tab-btn.on { color: var(--primary-text); border-bottom-color: var(--primary); font-weight: 500 }

/* ── TAGS (Ant Design Tag presets as Torque uses them) ── */
.tq-tag {
  display: inline-block; font-size: 10px; line-height: 19.8px; font-weight: 400;
  padding: 0 7px; border-radius: var(--r-sm); border: 1px solid; white-space: nowrap;
  color: var(--t-default-fg); background: var(--t-default-bg); border-color: var(--t-default-bd);
}
.tq-tag.strong { font-weight: 600 }
.tq-tag.head { font-size: 11px; font-weight: 600; text-transform: uppercase }
.tq-tag.boxed { padding: 2px 4px; line-height: 16px; border-color: transparent; white-space: normal }
.t-default { color: var(--t-default-fg); background: var(--t-default-bg); border-color: var(--t-default-bd) }
.t-blue    { color: var(--t-blue-fg);    background: var(--t-blue-bg);    border-color: var(--t-blue-bd) }
.t-proc    { color: var(--t-proc-fg);    background: var(--t-proc-bg);    border-color: var(--t-proc-bd) }
.t-gold    { color: var(--t-gold-fg);    background: var(--t-gold-bg);    border-color: var(--t-gold-bd) }
.t-warn    { color: var(--t-warn-fg);    background: var(--t-warn-bg);    border-color: var(--t-warn-bd) }
.t-ok      { color: var(--t-ok-fg);      background: var(--t-ok-bg);      border-color: var(--t-ok-bd) }
.t-err     { color: var(--t-err-fg);     background: var(--t-err-bg);     border-color: var(--t-err-bd) }
.t-volcano { color: var(--t-volcano-fg); background: var(--t-volcano-bg); border-color: var(--t-volcano-bd) }
.t-cyan    { color: var(--t-cyan-fg);    background: var(--t-cyan-bg);    border-color: var(--t-cyan-bd) }
.tq-tag.boxed.t-default, .tq-tag.boxed.t-blue, .tq-tag.boxed.t-proc, .tq-tag.boxed.t-gold, .tq-tag.boxed.t-ok,
.tq-tag.boxed.t-warn, .tq-tag.boxed.t-err, .tq-tag.boxed.t-volcano, .tq-tag.boxed.t-cyan { border-color: transparent }
/* "Tempo no status" style info box (bordered, bold) */
.tq-box { display: inline-block; font-size: 10px; line-height: 16px; font-weight: 600; padding: 1px 4px; border-radius: var(--r-sm); border: 1px solid }

/* ── COLUMN (Torque board column: colored top edge, tag + count head) ── */
.ger-section { margin: 0 16px 16px; border-radius: var(--r-lg); border-top: 3px solid var(--edge-default) }
.ger-section.c-ok { border-top-color: var(--edge-ok) }
.ger-section.c-warn { border-top-color: var(--edge-warn) }
.ger-section.c-breach { border-top-color: var(--edge-breach) }
.ger-section.c-info { border-top-color: var(--edge-info) }
.ger-section.c-volcano { border-top-color: #fa541c }
.ger-section.c-purple { border-top-color: #722ed1 }
.ger-section-title {
  display: flex; justify-content: space-between; align-items: center; gap: 4px;
  min-height: 37px; padding: 0 12px; margin-bottom: 8px;
  border-bottom: 1px solid var(--border-red);
}
.ger-count { font-size: 11px; color: var(--text-muted) }

/* ── EMPTY (Ant Design Empty) ── */
.ger-empty { text-align: center; padding: 48px 24px; color: var(--text-ghost); font-size: 13px }
.ger-empty svg { display: block; margin: 0 auto 8px; width: 64px; height: 41px }

/* ── ORDER CARD (Torque wholesale order card) ── */
.ger-card {
  margin: 0 8px 8px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--card-border);
  border-left: 4px solid var(--edge-default);
}
.ger-card.ok      { border-left-color: var(--edge-ok) }
.ger-card.warn    { border-left-color: var(--edge-warn) }
.ger-card.breach  { border-left-color: var(--edge-breach) }
.ger-card.neutral { border-left-color: var(--edge-info) }
.ger-card.purple  { border-left-color: #722ed1 }
.ger-card-head {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  min-height: 37px; padding: 0 12px; border-bottom: 1px solid var(--card-border);
}
.ger-card-body { padding: 6px 12px 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px }
.ger-rank { font-size: 11px; color: var(--text-muted) }
.ger-name { font-size: 12px; font-weight: 600; color: var(--text); min-width: 0 }
.ger-sec { font-size: 10px; color: var(--text-muted) }
.ger-tags { display: flex; flex-wrap: wrap; gap: 4px }
.ger-sla-bar { align-self: stretch; height: 6px; border-radius: 100px; background: rgba(0,0,0,.06); margin-top: 4px; overflow: hidden }
:root[data-theme="dark"] .ger-sla-bar { background: rgba(255,255,255,.12) }
.ger-sla-fill { height: 100%; border-radius: 100px; transition: width .3s }
.ger-notif-time { font-size: 10px; color: var(--text-muted) }
.ger-obs-wrap { align-self: stretch; margin-top: 6px }
.ger-obs-label { font-size: 12px; color: var(--text-muted); margin-bottom: 4px }
.ger-obs-ta {
  width: 100%; padding: 4px 11px;
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--surface); color: var(--text);
  font-family: inherit; font-size: 13px; line-height: 1.6154; resize: vertical;
  min-height: 54px; outline: none; transition: border-color .2s, box-shadow .2s;
}
.ger-obs-ta:hover { border-color: var(--primary-hover) }
.ger-obs-ta:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(216,0,1,.1) }
.ger-obs-save {
  margin-top: 6px; height: 24px; padding: 0 7px; border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text); font: 600 12px/1 'Inter', 'Segoe UI', system-ui, sans-serif;
  cursor: pointer; transition: all .2s;
}
.ger-obs-save:hover { color: var(--primary-hover); border-color: var(--primary-hover) }

/* ── STATISTICS (Ant Design Card + Statistic) ── */
.ger-stat-row { display: flex; gap: 8px; margin: 0 16px 16px; flex-wrap: wrap }
.ger-stat {
  flex: 1 1 0; min-width: 96px; padding: 12px; border-radius: var(--r-lg);
  background: var(--surface); border: 1px solid var(--card-border); box-shadow: var(--shadow);
}
.ger-stat-lbl { font-size: 13px; color: var(--text-muted) }
.ger-stat-val { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--text); margin-top: 2px }
.ger-stat-row.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)) }

/* ── PERIOD FILTER (Torque's Ant Design RangePicker) ── */
.ger-filter { margin: -4px 16px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; flex-shrink: 0 }
.range-label { font-size: 12px; color: var(--text-muted) }
.rp { position: relative }
.rp-input {
  display: inline-flex; align-items: center; gap: 12px; height: 34px; padding: 4px 11px;
  border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: var(--text);
  font: 14px 'Inter', 'Segoe UI', system-ui, sans-serif; cursor: pointer; transition: border-color .2s, box-shadow .2s;
}
.rp-input:hover { border-color: var(--primary-hover) }
.rp-input.open { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(216,0,1,.1) }
.rp-date { min-width: 84px; text-align: left; font-variant-numeric: tabular-nums }
.rp-input.picking .rp-date.active { color: var(--text-ghost) }
.rp-arrow, .rp-cal { width: 14px; height: 14px; color: var(--text-ghost); flex-shrink: 0 }
.rp-pop {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60;
  background: var(--surface); border-radius: var(--r); padding: 0;
  box-shadow: 0 6px 16px rgba(0,0,0,.08), 0 3px 6px -4px rgba(0,0,0,.12), 0 9px 28px 8px rgba(0,0,0,.05);
  display: flex; max-width: calc(100vw - var(--sider-w-min) - 24px); overflow-x: auto;
}
:root[data-theme="dark"] .rp-pop { background: #1f1f1f; box-shadow: 0 6px 16px rgba(0,0,0,.6) }
.rp-panel { width: 288px; flex-shrink: 0 }
.rp-panel + .rp-panel { border-left: 1px solid var(--border-red) }
.rp-head { display: flex; align-items: center; height: 40px; padding: 0 8px; border-bottom: 1px solid rgba(5,5,5,.06); font-weight: 600 }
:root[data-theme="dark"] .rp-head { border-bottom-color: #303030 }
.rp-head .rp-title { flex: 1; text-align: center; font-size: 14px }
.rp-nav { width: 24px; height: 24px; border: 0; background: none; color: var(--text-ghost); cursor: pointer; font-size: 14px; line-height: 1; border-radius: 4px }
.rp-nav:hover { color: var(--text) }
.rp-nav.hide { visibility: hidden }
.rp-grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 8px 12px 12px; row-gap: 4px }
.rp-wd { height: 32px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--text) }
.rp-day { position: relative; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: var(--text); border: 0; background: none; font-family: inherit }
.rp-day span { position: relative; z-index: 1; min-width: 26px; height: 26px; line-height: 26px; border-radius: 4px; display: inline-block }

/* ── KANBAN BOARD (Torque "Acompanhamento"): 280px columns side by side ── */
.board {
  display: flex; gap: 12px; align-items: stretch;
  overflow-x: auto; overflow-y: hidden; padding: 0 16px 12px;
  scroll-snap-type: x proximity; scroll-padding-inline: 16px; -webkit-overflow-scrolling: touch;
  flex: 1 0 360px; min-height: 360px;
}
/* the board takes whatever height is left under the title and tabs */
#gerList { flex: 1 0 auto; display: flex; flex-direction: column; min-height: 0 }
.board::-webkit-scrollbar { height: 6px }
.board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px }
.board .ger-section {
  flex: 0 0 min(280px, 82vw); margin: 0; scroll-snap-align: start;
  display: flex; flex-direction: column; min-height: 0;
  border: 1px solid var(--card-border); border-top-width: 3px;
}
.board .ger-section.c-ok { border-top-color: var(--edge-ok) }
.board .ger-section.c-warn { border-top-color: var(--edge-warn) }
.board .ger-section.c-breach { border-top-color: var(--edge-breach) }
.board .ger-section.c-info { border-top-color: var(--edge-info) }
.board .ger-section.c-volcano { border-top-color: #fa541c }

.board .ger-col-body { flex: 1; min-height: 0; overflow-y: auto; padding-top: 2px }
.board .ger-col-body::-webkit-scrollbar { width: 4px }

.ger-stat-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }

.nav-pip { width: 6px; height: 6px; border-radius: 50%; background: #E8B800 }

@keyframes pulse-sla { 0%,100%{opacity:1} 50%{opacity:.55} }
.ger-card.breach .tq-box { animation: pulse-sla .9s ease-in-out infinite }
.ger-card.warn .tq-box { animation: pulse-sla 1.8s ease-in-out infinite }
@media (prefers-reduced-motion: reduce) { .tq-box { animation: none !important } }

<script>
'use strict'

/* ── TORQUE (Appwrite) ── */
// Same backend and login as the web panel atacado.fmtorque.com.br.
// No API key here: the repo is public. Access comes from the signed-in Torque user's session.
const TQ = {
  endpoint: 'https://appwrite.fmtorque.com.br/v1',
  project:  'fm-torque',
  db:       'main-db',
  pollMs:   30000
}
// Torque wholesale order status → app status key
const TQ_STATUS = {
  IN_ORDER:'em_pedido', ORDER_READY:'pedido_pronto', READY_TO_COLLECT:'pedido_pronto', COLLECTING:'em_coleta',
  NEEDS_CHANGE:'validar_alteracao', ORDER_CHANGE:'alterar_pedido', COLLECTED:'coletado',
  IN_EXPEDITION:'em_expedicao', ORDER_PACKAGED:'embalado', NEXT_ROUTE:'proxima_rota',
  READY_FOR_DELIVERY:'pronto_entrega', IN_ROUTE:'em_rota', DELIVERED:'entregue',
  DELIVERY_FINISHED:'entrega_finalizada', CHECKED:'concluida', WAITING:'aguardando',
  PRE_CANCELED:'pre_cancelado', CANCELED:'cancelado'
}
// Torque order priority → app delivery type (SLA thresholds live in TIPO_SLA)
const TQ_TIPO = {
  URGENCY_1:'urg1_retira', URGENCY_2:'nao_em_loja', DEADLINE_2H:'entrega_2h',
  DELIVER_SAME_DAY:'entrega_dia', DELIVER_NEXT_DAY:'entrega_outro_dia'
}
// Statuses still inside the warehouse flow: fetched whatever their age
const TQ_OPEN = ['IN_ORDER','ORDER_READY','READY_TO_COLLECT','COLLECTING','NEEDS_CHANGE','ORDER_CHANGE','COLLECTED','IN_EXPEDITION']

/* ── STORAGE ── */
const S = {
  get(k, def) { try { const v=localStorage.getItem(k); return v===null?def:JSON.parse(v) } catch(e){ return def } },
  set(k, v)   { try { localStorage.setItem(k, JSON.stringify(v)) } catch(e){} }
}

/* ── SLA CONFIG ── */
// Priority labels and tag colors exactly as the Torque board shows them
const TIPO_LABELS = {
  urg1_retira:       'Urgente 1 (Esta na loja)',
  nao_em_loja:       'Urgente 2 (Não esta na loja)',
  entrega_2h:        'Prazo 2h',
  entrega_dia:       'Entregar no dia',
  entrega_outro_dia: 'Entregar no outro dia'
}
const TIPO_TAG = { urg1_retira:'t-err', nao_em_loja:'t-blue', entrega_2h:'t-warn', entrega_dia:'t-ok', entrega_outro_dia:'t-proc' }
const TIPO_SLA = {
  urg1_retira:       { alertMs:  5*60000, slaMs: 10*60000 },
  nao_em_loja:       { alertMs:  5*60000, slaMs: 10*60000 },
  entrega_2h:        { alertMs: 10*60000, slaMs: 20*60000 },
  entrega_dia:       { alertMs: 10*60000, slaMs: 20*60000 },
  entrega_outro_dia: null
}
// Status labels and tag colors exactly as the Torque board shows them
const STATUS_LABELS = {
  em_pedido:'Em pedido', pedido_pronto:'Pedido pronto', em_coleta:'Em coleta',
  validar_alteracao:'Validar alteração', alterar_pedido:'Alterar pedido',
  coletado:'Coletado', em_expedicao:'Em expedição', embalado:'Pronto',
  proxima_rota:'Próxima rota', pronto_entrega:'Pronto para entrega', em_rota:'Em rota',
  entregue:'Entregue', entrega_finalizada:'Entrega finalizada', concluida:'Conferido',
  aguardando:'Aguardando', pre_cancelado:'Pre Cancelado', cancelado:'Cancelado'
}
const STATUS_TAG = {
  em_pedido:'t-default', pedido_pronto:'t-proc', em_coleta:'t-warn', coletado:'t-ok',
  validar_alteracao:'t-err', alterar_pedido:'t-volcano', em_expedicao:'t-proc', embalado:'t-ok',
  proxima_rota:'t-default', pronto_entrega:'t-cyan', em_rota:'t-proc', entregue:'t-default',
  entrega_finalizada:'t-ok', concluida:'t-ok', aguardando:'t-warn', pre_cancelado:'t-volcano', cancelado:'t-err'
}
const statusTag = s => `<span class="tq-tag strong ${STATUS_TAG[s]||'t-default'}">${STATUS_LABELS[s]||esc(s)}</span>`
const tipoTag = t => t ? `<span class="tq-tag boxed ${TIPO_TAG[t]||'t-default'}">Prioridade: ${TIPO_LABELS[t]||esc(t)}</span>` : ''
// SLA state → tag/box color
const SLA_TONE = { ok:'t-ok', warn:'t-warn', breach:'t-err', neutral:'t-proc' }
// Same duration format as Torque's "Tempo no status: 2h 27m"
const fmtDur = ms => { const m = Math.max(0, Math.floor(ms/60000)), h = Math.floor(m/60); return h > 0 ? `${h}h ${m%60}m` : `${m}m` }
const EMPTY_SVG = '<svg viewBox="0 0 64 41" xmlns="http://www.w3.org/2000/svg"><g transform="translate(0 1)" fill="none" fill-rule="evenodd"><ellipse fill="currentColor" opacity=".12" cx="32" cy="33" rx="32" ry="7"/><g fill-rule="nonzero" stroke="currentColor" opacity=".45"><path d="M55 12.76L44.854 1.258C44.367.474 43.656 0 42.907 0H21.093c-.749 0-1.46.474-1.947 1.257L9 12.761V22h46v-9.24z"/><path d="M41.613 15.931c0-1.605.994-2.93 2.227-2.931H55v18.137C55 33.26 53.68 35 52.05 35h-40.1C10.32 35 9 33.259 9 31.137V13h11.16c1.233 0 2.227 1.323 2.227 2.928v.022c0 1.605 1.005 2.901 2.237 2.901h14.752c1.232 0 2.237-1.308 2.237-2.913v-.007z"/></g></g></svg>'
const emptyState = msg => `<div class="ger-empty">${EMPTY_SVG}${msg}</div>`
// Board-style column: colored top edge + uppercase tag + count
const column = (title, tone, edge, count, body) =>
  `<div class="ger-section ${edge}"><div class="ger-section-title"><span class="tq-tag head ${tone}">${title}</span><span class="ger-count">${count}</span></div><div class="ger-col-body">${body}</div></div>`
// Kanban like Torque's "Acompanhamento": columns side by side, each scrolling on its own
const board = cols => `<div class="board">${cols.join('')}</div>`
// column top-edge color for a status tag tone
const EDGE_OF = { 't-proc':'c-info', 't-blue':'c-info', 't-warn':'c-warn', 't-err':'c-breach', 't-volcano':'c-volcano', 't-ok':'c-ok', 't-cyan':'c-info', 't-default':'' }
// Card body lines as on the Torque board: bold title, customer (user icon), seller, then branch
const ICON_USER = '<svg viewBox="64 64 896 896" fill="currentColor" aria-hidden="true"><path d="M858.5 763.6a374 374 0 00-80.6-119.5 375.63 375.63 0 00-119.5-80.6c-.4-.2-.8-.3-1.2-.5C719.5 518 760 444.7 760 362c0-137-111-248-248-248S264 225 264 362c0 82.7 40.5 156 102.8 201.1-.4.2-.8.3-1.2.5-44.8 18.9-85 46-119.5 80.6a375.63 375.63 0 00-80.6 119.5A371.7 371.7 0 00136 901.8a8 8 0 008 8.2h60c4.4 0 7.9-3.5 8-7.8 2-77.2 33-149.5 87.8-204.3 56.7-56.7 132-87.9 212.2-87.9s155.5 31.2 212.2 87.9C779 752.7 810 825 812 902.2c.1 4.4 3.6 7.8 8 7.8h60a8 8 0 008-8.2c-1-47.8-10.9-94.3-29.5-138.2zM512 534c-45.9 0-89.1-17.9-121.6-50.4S340 407.9 340 362c0-45.9 17.9-89.1 50.4-121.6S466.1 190 512 190s89.1 17.9 121.6 50.4S684 316.1 684 362c0 45.9-17.9 89.1-50.4 121.6S557.9 534 512 534z"/></svg>'
const cardWho = r => `<strong class="ger-name">${esc(r.title)}</strong>
        ${r.cliente ? `<span class="ger-who">${ICON_USER}${esc(r.cliente)}</span>` : ''}
        ${r.vendedor ? `<span class="ger-sec">Vendedor: ${esc(r.vendedor)}</span>` : ''}
        <span class="ger-sec">${esc(r.contactName)}</span>
        ${r.itens ? `<span class="tq-tag">${r.itens} ${r.itens===1 ? 'item' : 'itens'}</span>` : ''}`

/* ── AUDITORIA (status timeline, same wording as Torque) ── */

/* ── GERENCIAL: PARADOS ── */
function renderGerParados(el){
  const nowMs = Date.now()
  const items = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const contactName = contact ? contact.name : token
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(s==='concluida') return
      if(!SLA_ACTIVE.has(s)) return
      const changedAt = r.statusChangedAt||r.createdAt||0
      const elapsed   = nowMs - changedAt
      const cfg       = (r.tipo && TIPO_SLA[r.tipo]) || null
      const slaState  = !cfg ? 'ok' : elapsed>=cfg.slaMs?'breach':elapsed>=cfg.alertMs?'warn':'ok'
      items.push({...r, id:reqId, token, contactName, elapsed, slaState, cfg})
    })
  })
  items.sort((a,b)=>b.elapsed-a.elapsed)

  const edge = { ok:'var(--edge-ok)', warn:'var(--edge-warn)', breach:'var(--edge-breach)' }
  const card = (r,i) => {
    const s = r.status||'em_pedido'
    const pct = r.cfg ? Math.min(100,(r.elapsed/r.cfg.slaMs)*100) : 0
    return `<div class="ger-card ${r.slaState} clickable" onclick="openAudit('${r.token}','${r.id}')">
      <div class="ger-card-head">${statusTag(s)}<span class="ger-rank">#${i+1}</span></div>
      <div class="ger-card-body">
        ${cardWho(r)}
        ${tipoTag(r.tipo)}
        <span class="tq-box ${SLA_TONE[r.slaState]}">Tempo no status: ${fmtDur(r.elapsed)}${r.cfg?` · SLA ${r.cfg.slaMs/60000}m`:''}</span>
        ${r.cfg ? `<div class="ger-sla-bar"><div class="ger-sla-fill" style="width:${pct}%;background:${edge[r.slaState]}"></div></div>` : ''}
      </div>
    </div>`
  }
  // one column per board status, in the Torque board order
  const order = ['pedido_pronto','em_coleta','coletado','em_expedicao','validar_alteracao','alterar_pedido']
    .filter(s => SLA_ACTIVE.has(s))
  const cols = order.map(s => {
    const list = items.filter(r => (r.status||'') === s)
    const tone = STATUS_TAG[s] || 't-default'
    return column(STATUS_LABELS[s] || s, tone, EDGE_OF[tone] || '', list.length,
      list.length ? list.map(card).join('') : emptyState('Nenhum pedido'))
  })
  el.innerHTML = board(cols)
}

/* ── GERENCIAL: SEPARAÇÃO ──
   Four times per order, from the Torque status history (same data as the Auditoria):
   - Espera em Pedido pronto: time sitting in "Pedido pronto"
   - Coleta: from "Em coleta" until it reaches "Coletado"
   - Espera em Coletado: time sitting in "Coletado"
   - Expedição: from "Em expedição" until "Pronto" (entrega, retira or transportadora = ORDER_PACKAGED) */
const SEP_READY = new Set(['ORDER_READY','READY_TO_COLLECT'])
// statuses an unfinished span may still be in (an alteration happens inside the phase)
const SEP_IN_COLETA = new Set(['COLLECTING','NEEDS_CHANGE','ORDER_CHANGE'])
const SEP_IN_EXPED  = new Set(['IN_EXPEDITION','NEEDS_CHANGE','ORDER_CHANGE','COLLECTED'])

function sepTimes(r){
  const ev = (r.audit || []).filter(e => e.at).slice().sort((a,b) => a.at - b.at)
  const now = Date.now()
  const cur = ev.length ? ev[ev.length-1].to : ''
  const t = { pronto:0, prontoOpen:false, coleta:0, coletaOpen:false, coletado:0, coletadoOpen:false, exped:0, expedOpen:false }
  // span: first entry into start → next arrival at end (alterations in between count, as on the board)
  const span = (start, end, key, inPhase) => {
    let open = null
    ev.forEach(e => {
      if(open === null && start.has(e.to)) open = e.at
      else if(open !== null && end.has(e.to)){ t[key] += e.at - open; open = null }
    })
    if(open !== null && inPhase.has(cur)){ t[key] += now - open; t[key+'Open'] = true }
  }
  // stay: every period spent in the column, until the next move (or now, if still there)
  const stay = (set, key) => {
    ev.forEach((e, i) => {
      if(!set.has(e.to)) return
      const next = ev[i+1]
      t[key] += (next ? next.at : now) - e.at
      if(!next) t[key+'Open'] = true
    })
  }
  stay(SEP_READY, 'pronto')
  span(new Set(['COLLECTING']), new Set(['COLLECTED']), 'coleta', SEP_IN_COLETA)
  stay(new Set(['COLLECTED']), 'coletado')
  span(new Set(['IN_EXPEDITION']), new Set(['ORDER_PACKAGED']), 'exped', SEP_IN_EXPED)
  return t
}

const SEP_METRICS = [

  { key:'coleta',   title:'Coleta',                  box:'Coleta',                  tone:'t-warn', edge:'c-warn',  card:'warn',    bar:'var(--edge-warn)' },

]

/* ── GERENCIAL: VELOCIDADE (tab id 'sku') ──
   Same math as Torque's "Métricas estoque → Coleta/Expedição — mais demoradas (velocity)":
   - each stay in "Em coleta" (or "Em expedição") is one row: from arrival until leftAt / next move
   - SKUs = distinct product codes of the order
   - velocity = time ÷ SKUs; worst (slowest) first
   - responsible = the stay's assignee, else the order's collector/expeditor on the last stay,
     else who moved it; "Troca" when the order was handed over inside the same column */
const VEL_TOP = 10
const ORDER_TYPE = { DELIVERY:['Entrega','t-blue'], TAKEOUT:['Retira','t-gold'], CARRIER:['Transportadora','t-proc'] }

// Torque's duration format: "14h 22min 37s", "57 min 30s", "48s"
function fmtHms(ms){
  if(!(ms >= 0) || !isFinite(ms)) return '—'
  const s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60
  if(h > 0) return r > 0 ? `${h}h ${m}min ${r}s` : m > 0 ? `${h}h ${m}min` : `${h}h`
  return m > 0 ? (r > 0 ? `${m} min ${r}s` : `${m} min`) : `${r}s`
}

function velStints(r, status, orderAssignee){
  const ev = r.rawHist || []
  const idx = []
  ev.forEach((e, i) => { if(e.raw === status) idx.push(i) })
  const last = idx[idx.length-1]
  const out = []
  idx.forEach(i => {
    const c = ev[i]
    if(!c.changedAt) return
    const next = ev[i+1]
    const end = c.leftAt || (next ? next.changedAt : 0)
    const dur = end ? end - c.changedAt : 0
    if(!(dur > 0)) return                       // still in the column: not measured yet
    const assignee = (c.assignee || '').trim() || (i === last ? (orderAssignee || '').trim() : (c.by || '').trim())
    out.push({ durationMs: dur, assignee, handoff: c.from === status, arrivedAt: c.changedAt })
  })
  return out
}

const VEL_PHASES = [
  { key:'coleta', status:'COLLECTING', title:'Coleta — menor velocidade', short:'Coleta', tone:'t-warn', edge:'c-warn', card:'warn', who:'collectorUserId' },
  { key:'exped', status:'IN_EXPEDITION', title:'Expedição — menor velocidade', short:'Expedição', tone:'t-proc', edge:'c-info', card:'neutral', who:'expeditionUserId' }
]

function renderGerSku(el){
  const orders = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    const contact = contacts.find(c=>c.token===token)
    const contactName = contact ? contact.name : token
    Object.entries(reqs).forEach(([reqId, r])=>{ if(r && r.inPeriod) orders.push({ ...r, id:reqId, token, contactName }) })
  })

  const stats = [], cols = []
  VEL_PHASES.forEach(ph => {
    const rows = []
    orders.forEach(o => velStints(o, ph.status, o[ph.who]).forEach(s => {
      rows.push({ o, ...s, skus: o.skus, vel: o.skus > 0 ? s.durationMs / o.skus : null })
    }))
    const ranked = rows.filter(x => x.vel != null).sort((a,b) => (b.vel - a.vel) || (b.durationMs - a.durationMs))
    const avg = ranked.length ? ranked.reduce((s,x) => s + x.vel, 0) / ranked.length : 0
    stats.push(`<div class="ger-stat">
      <div class="ger-stat-lbl">${ph.short}: média por SKU</div>
      <div class="ger-stat-val">${ranked.length ? fmtHms(avg) : '—'}</div>
      <div class="ger-stat-sub">Pior: ${ranked.length ? fmtHms(ranked[0].vel) + '/SKU' : '—'}</div>
      <div class="ger-stat-sub">${ranked.length} passage${ranked.length===1?'m':'ns'} medida${ranked.length===1?'':'s'}</div>
    </div>`)
    const max = ranked.length ? ranked[0].vel : 1
    const cards = ranked.slice(0, VEL_TOP).map((x,i) => {
      const t = ORDER_TYPE[x.o.orderType]
      return `<div class="ger-card ${ph.card} clickable" onclick="openAudit('${x.o.token}','${x.o.id}')">
      <div class="ger-card-head">${t ? `<span class="tq-tag strong ${t[1]}">${t[0]}</span>` : statusTag(x.o.status)}<span class="ger-rank">#${i+1}</span></div>
      <div class="ger-card-body">
        ${cardWho(x.o)}
        ${tipoTag(x.o.tipo)}
        <span class="ger-sec">Responsável: ${esc(userNames[x.assignee] || '—')}</span>
        <div class="ger-tags">
          <span class="tq-box ${ph.tone}">Velocity: ${fmtHms(x.vel)}/SKU</span>
          ${x.handoff ? '<span class="tq-tag t-volcano">Troca</span>' : ''}
        </div>
        <span class="ger-sec">Tempo: ${fmtHms(x.durationMs)} · ${x.skus} SKU${x.skus===1?'':'s'}</span>
        <div class="ger-sla-bar"><div class="ger-sla-fill" style="width:${Math.min(100, x.vel/max*100)}%;background:${ph.key==='coleta' ? 'var(--edge-warn)' : 'var(--edge-info)'}"></div></div>
      </div>
    </div>` }).join('')
    cols.push(column(ph.title, ph.tone, ph.edge, ranked.length, cards || emptyState('Nenhuma passagem medida no período')))
  })

  el.innerHTML = `<div class="ger-stat-row grid2">${stats.join('')}</div>${board(cols)}`
}

function saveAlertObs(alertId, obs){
  // the background monitor may have added records since the page loaded them
  if(window.AndroidBridge){ try{ slaAlerts = JSON.parse(AndroidBridge.getAlertRecords() || '[]') }catch(e){} }
  const rec = slaAlerts.find(a=>a.id===alertId)
  if(rec){
    rec.obs = obs
    S.set('ger_alert_records', slaAlerts)
    if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(slaAlerts)) }catch(e){}
  }
}

/* ── SYNC PIPELINE TO ANDROID ── */
function syncPipelineToAndroid(){
  if(!window.AndroidBridge) return
  const active = []
  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s)||!r.tipo||!TIPO_SLA[r.tipo]) return
      const rawTs = r.statusChangedAt||r.createdAt||0
      const seenKey = reqId+'_'+s
      if(!seenTs[seenKey]) seenTs[seenKey] = Date.now()
      const effectiveChangedAt = rawTs>0 ? rawTs : seenTs[seenKey]
      active.push({ id:reqId, token, title:r.title||reqId, status:s, tipo:r.tipo,
        statusChangedAt: effectiveChangedAt, createdAt: r.createdAt||0 })
    })
  })
  try{ AndroidBridge.savePipelineRequests(JSON.stringify(active)) }catch(e){}
}

/* ── SLA NOTIFICATION CHECK ── */
function updateAlertPip(){
  const nRecent = slaAlerts.filter(a=>Date.now()-a.firedAt<60*60000).length
  const pip = document.getElementById('alertPip')
  if(pip) pip.style.display = nRecent>0?'block':'none'
}

function checkSlaNotifs(){
  // On the phone the background monitor (SlaMonitorService) sends the notifications and
  // writes the alert records, app open or closed; the page only shows them.
  if(window.AndroidBridge){
    try{ slaAlerts = JSON.parse(AndroidBridge.getAlertRecords() || '[]') }catch(e){}
    updateAlertPip()
    if(curGerTab==='alertas' && !document.querySelector('.ger-obs-ta:focus')) renderGerencial()
    return
  }
  const nowMs = Date.now()
  let changed = false

  Object.entries(allRequests).forEach(([token, reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(!r) return
      const s = r.status||'em_pedido'
      if(!SLA_ACTIVE.has(s)||!r.tipo||!TIPO_SLA[r.tipo]) return
      const cfg = TIPO_SLA[r.tipo]; if(!cfg) return

      const rawChangedAt = r.statusChangedAt||r.createdAt||0
      const seenKey = reqId+'_'+s
      if(!seenTs[seenKey]) seenTs[seenKey] = nowMs
      const changedAt = rawChangedAt>0 ? rawChangedAt : seenTs[seenKey]
      const elapsed   = nowMs - changedAt
      const slaKey    = 'sla_'+reqId
      const lastFired = notifTs[slaKey]||0

      if(changedAt>0 && elapsed>=cfg.alertMs && lastFired<changedAt){
        const elMin    = Math.floor(elapsed/60000)
        const slaMin   = cfg.slaMs/60000
        const isBreach = elapsed>=cfg.slaMs
        const icon     = isBreach ? '🔴' : '⚠️'
        const status   = STATUS_LABELS[s]||s
        const tipo     = TIPO_LABELS[r.tipo]||r.tipo
        const timeStr  = fmtTime(Date.now())
        sendNotif(
          `${icon} ${timeStr} — ${isBreach?'SLA Estourado!':'Pedido Parado'}`,
          `"${r.title}" — ${status} há ${elMin}min (${tipo}, SLA: ${slaMin}min)`
        )
        const contact = contacts.find(c=>c.token===token)
        slaAlerts.unshift({
          id: `${Date.now()}_${reqId}`,
          reqId, token, reqTitle: r.title||reqId,
          contactName: contact?contact.name:token,
          tipo: r.tipo, status: s,
          changedAt, firedAt: Date.now(), elapsedMs: elapsed, isBreach, obs: ''
        })
        if(slaAlerts.length>200) slaAlerts = slaAlerts.slice(0,200)
        S.set('ger_alert_records', slaAlerts)
        if(window.AndroidBridge) try{ AndroidBridge.saveAlertRecords(JSON.stringify(slaAlerts)) }catch(e){}
        notifTs[slaKey] = changedAt
        changed = true
      }
    })
  })

  if(changed){
    S.set('ger_notif_ts', notifTs)
    if(window.AndroidBridge) try{ AndroidBridge.saveNotifTs(JSON.stringify(notifTs)) }catch(e){}
  }

  // Cleanup seenTs
  const activeKeys = new Set()
  Object.entries(allRequests).forEach(([,reqs])=>{
    if(!reqs) return
    Object.entries(reqs).forEach(([reqId, r])=>{
      if(r && SLA_ACTIVE.has(r.status||'')) activeKeys.add(reqId+'_'+(r.status||''))
    })
  })
  Object.keys(seenTs).forEach(k=>{ if(!activeKeys.has(k)) delete seenTs[k] })

  updateAlertPip()
}

/* ── TORQUE API ── */
function tqHeaders(){
  const h = { 'X-Appwrite-Project': TQ.project, 'Content-Type': 'application/json' }
  // The WebView page is file://, so the session cookie may not stick; Appwrite hands it back in this header instead
  const fb = S.get('tq_cookie_fallback', '')
  if(fb) h['X-Fallback-Cookies'] = fb
  return h
}

async function tqFetch(path, opts={}){
  const res = await fetch(TQ.endpoint + path, {
    method: opts.method || 'GET',
    headers: tqHeaders(),
    credentials: 'include',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  })
  const fb = res.headers.get('X-Fallback-Cookies')
  if(fb) S.set('tq_cookie_fallback', fb)
  const txt = await res.text()
  let data = null
  try{ data = txt ? JSON.parse(txt) : null }catch(e){}
  if(!res.ok){
    const err = new Error((data && data.message) || ('HTTP ' + res.status))
    err.status = res.status
    throw err
  }
  return data
}

const tqQ = o => 'queries[]=' + encodeURIComponent(JSON.stringify(o))

// All rows matching the queries, paged with a cursor
async function tqRows(table, queries, pageSize=500){
  const all = []
  let cursor = null
  for(let guard=0; guard<40; guard++){
    const qs = queries.concat([{ method:'limit', values:[pageSize] }])
    if(cursor) qs.push({ method:'cursorAfter', values:[cursor] })
    const r = await tqFetch(`/tablesdb/${TQ.db}/tables/${table}/rows?` + qs.map(tqQ).join('&'))
    const rows = (r && r.rows) || []
    all.push(...rows)
    if(rows.length < pageSize) break
    cursor = rows[rows.length-1].$id
  }
  return all
}

let branchNames = {}
async function tqLoadBranches(){
  try{
    const rows = await tqRows('branches', [{ method:'select', values:['$id','name'] }], 100)
    rows.forEach(b => { branchNames[b.$id] = b.name })
  }catch(e){ /* names are cosmetic: cards fall back to the branch id */ }
}

// Torque user id → name, for "Vendedor" and the audit trail
let userNames = {}
async function tqLoadUsers(){
  try{
    const rows = await tqRows('users_profile', [{ method:'select', values:['$id','userId','name'] }], 500)
    rows.forEach(u => { if(u.userId) userNames[u.userId] = u.name })
  }catch(e){ /* audit falls back to "Alguém" */ }
}

/* ── PERIOD FILTER ── */
// Separação, Velocidade and Alertas show orders CREATED in the period; Parados always shows what is stuck now.
const RANGE_MAX_DAYS = 62
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d) }
const todayYmd = () => ymd(new Date())
// the chosen period is kept for the day; a new day opens on "today", as the Torque panel does
let tqRange = (() => {
  const saved = S.get('ger_range', null)
  if(saved && saved.day === todayYmd() && saved.from && saved.to) return { from: saved.from, to: saved.to }
  return { from: todayYmd(), to: todayYmd() }
})()
function currentRange(){ return tqRange }
function rangeBounds(){
  const r = currentRange()
  const from = parseYmd(r.from), to = parseYmd(r.to); to.setDate(to.getDate()+1)
  return { from, to, fromISO: from.toISOString(), toISO: to.toISOString() }
}
const inRange = ts => { const b = rangeBounds(); return ts >= b.from.getTime() && ts < b.to.getTime() }

function renderRangeBar(){
  const r = currentRange()
  document.getElementById('rpFrom').textContent = r.from
  document.getElementById('rpTo').textContent = r.to
  document.getElementById('rangeHint').textContent = curGerTab==='alertas' ? 'Alertas disparados no período' : 'Pedidos criados no período'
  document.getElementById('gerFilter').hidden = curGerTab==='parados'
}
function setRange(from, to){
  if(from > to) [from, to] = [to, from]
  const days = (parseYmd(to) - parseYmd(from)) / 864e5 + 1
  if(days > RANGE_MAX_DAYS){
    const f = parseYmd(to); f.setDate(f.getDate() - RANGE_MAX_DAYS + 1); from = ymd(f)
    toast(`Período limitado a ${RANGE_MAX_DAYS} dias`)
  }
  tqRange = { from, to }
  S.set('ger_range', { from, to, day: todayYmd() })
  renderRangeBar()
  periodCache.key = ''          // force a fresh fetch for the new period
  renderGerencial()
  tqRefresh()
}

/* ── RANGE PICKER (same behaviour as Torque's: 1st click = start, 2nd click = end) ── */
const RP_MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez']
const RP_WEEK = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']
const rp = { open:false, view:null, start:null, hover:null }

function toggleRangePicker(){ rp.open ? closeRangePicker() : openRangePicker() }
function openRangePicker(){
  const f = parseYmd(currentRange().from)
  rp.view = new Date(f.getFullYear(), f.getMonth(), 1)
  rp.open = true; rp.start = null; rp.hover = null
  document.getElementById('rpPop').hidden = false
  const input = document.getElementById('rpInput')
  input.classList.add('open'); input.setAttribute('aria-expanded', 'true')
  drawRangePicker()
}
function closeRangePicker(){
  rp.open = false; rp.start = null; rp.hover = null
  document.getElementById('rpPop').hidden = true
  const input = document.getElementById('rpInput')
  input.classList.remove('open', 'picking'); input.setAttribute('aria-expanded', 'false')
  renderRangeBar()
}

function rpPanel(base, showPrev, showNext, a, b){
  const y = base.getFullYear(), m = base.getMonth()
  const first = new Date(y, m, 1)
  const start = new Date(y, m, 1 - first.getDay())     // Sunday before the 1st
  const today = todayYmd()
  let cells = RP_WEEK.map(w => `<div class="rp-wd">${w}</div>`).join('')
  for(let i=0; i<42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i)
    const k = ymd(d)
    const cls = ['rp-day']
    if(d.getMonth() !== m) cls.push('out')
    if(k === today) cls.push('today')
    if(a && b && k >= a && k <= b) cls.push('in')
    if(k === a) cls.push('start')
    if(k === b) cls.push('end')
    cells += `<button type="button" class="${cls.join(' ')}" data-d="${k}"><span>${d.getDate()}</span></button>`
  }
  const nav = (n, label, show) => `<button type="button" class="rp-nav${show ? '' : ' hide'}" data-nav="${n}" aria-label="${label}">${n===-12?'«':n===-1?'‹':n===1?'›':'»'}</button>`
  return `<div class="rp-panel">
    <div class="rp-head">${nav(-12,'Ano anterior',showPrev)}${nav(-1,'Mês anterior',showPrev)}
      <div class="rp-title">${y} ${RP_MONTHS[m]}</div>${nav(1,'Próximo mês',showNext)}${nav(12,'Próximo ano',showNext)}</div>
    <div class="rp-grid">${cells}</div></div>`
}
function drawRangePicker(){
  const r = currentRange()
  let a = r.from, b = r.to
  if(rp.start){ a = rp.start; b = rp.hover || rp.start; if(b < a) [a, b] = [b, a] }
  const narrow = window.matchMedia('(max-width: 700px)').matches
  const next = new Date(rp.view.getFullYear(), rp.view.getMonth()+1, 1)
  document.getElementById('rpPop').innerHTML = rpPanel(rp.view, true, narrow, a, b) + rpPanel(next, false, true, a, b)
  // the field shows the dates being picked, like Torque
  document.getElementById('rpFrom').textContent = a
  document.getElementById('rpTo').textContent = b
}

;(function initRangePicker(){
  const pop = document.getElementById('rpPop')
  pop.addEventListener('click', e => {
    e.stopPropagation()
    const nav = e.target.closest('[data-nav]')
    if(nav){ const n = Number(nav.dataset.nav); rp.view = new Date(rp.view.getFullYear(), rp.view.getMonth()+n, 1); drawRangePicker(); return }
    const day = e.target.closest('[data-d]')
    if(!day) return
    if(!rp.start){
      rp.start = day.dataset.d; rp.hover = null
      document.getElementById('rpInput').classList.add('picking')
      drawRangePicker()
    }else{
      const from = rp.start, to = day.dataset.d
      closeRangePicker()
      setRange(from, to)
    }
  })
  pop.addEventListener('mouseover', e => {
    const day = e.target.closest('[data-d]')
    if(rp.start && day && day.dataset.d !== rp.hover){ rp.hover = day.dataset.d; drawRangePicker() }
  })
  document.addEventListener('click', e => { if(rp.open && !e.target.closest('#rp')) closeRangePicker() })
  document.addEventListener('keydown', e => { if(e.key==='Escape' && rp.open) closeRangePicker() })
})()

/* ── LOAD ── */
const ORDER_FIELDS = { method:'select', values:['$id','$createdAt','$updatedAt','internalId','displayCode','title',
  'status','priority','type','customerNameSnapshot','branchId','sellerUserId','collectorUserId','expeditionUserId'] }
// orders created in the period + their history, refetched when the period changes, on "Atualizar",
// or every 5 min while the period includes today (past periods barely change)
let periodCache = { key:'', orders:[], hist:[], items:{}, at:0 }

// history of many orders: batches of 100 ids, 4 batches at a time
async function tqHistory(ids){
  const batches = []
  for(let i=0; i<ids.length; i+=100) batches.push(ids.slice(i, i+100))
  const out = []
  for(let i=0; i<batches.length; i+=4){
    const parts = await Promise.all(batches.slice(i, i+4).map(b => tqRows('sales_orders_whsl_status_history', [
      { method:'equal', attribute:'salesOrderWholesaleId', values:b },
      { method:'select', values:['$id','salesOrderWholesaleId','fromStatus','toStatus','arrivedAt','leftAt','changedByUserId','assigneeUserId'] }
    ], 2000)))
    parts.forEach(p => out.push(...p))
  }
  return out
}

// per order: product lines ("30 itens" on the Torque card) and distinct product codes
// ("SKUs" in Torque's Métricas estoque), same batching as the history
async function tqItemCounts(ids){
  const batches = []
  for(let i=0; i<ids.length; i+=100) batches.push(ids.slice(i, i+100))
  const lines = {}, codes = {}
  for(let i=0; i<batches.length; i+=4){
    const parts = await Promise.all(batches.slice(i, i+4).map(b => tqRows('sales_orders_whsl_items', [
      { method:'equal', attribute:'salesOrderWholesaleId', values:b },
      { method:'select', values:['$id','salesOrderWholesaleId','productCode'] }
    ], 5000)))
    parts.forEach(p => p.forEach(it => {
      const id = it.salesOrderWholesaleId
      lines[id] = (lines[id] || 0) + 1
      const code = String(it.productCode || '').trim()
      if(code){ if(!codes[id]) codes[id] = new Set(); codes[id].add(code) }
    }))
  }
  const counts = {}
  Object.keys(lines).forEach(id => { counts[id] = { itens: lines[id], skus: codes[id] ? codes[id].size : 0 } })
  return counts
}

async function tqLoad(force){
  const b = rangeBounds()
  const key = b.fromISO + '|' + b.toISO
  const live = b.to.getTime() > Date.now()
  const stale = force || periodCache.key !== key || (live && Date.now() - periodCache.at > 5*60000)

  // what is stuck now (Parados + notifications): always fresh
  const open = await tqRows('sales_orders_whsl', [{ method:'equal', attribute:'status', values:TQ_OPEN }, ORDER_FIELDS])
  if(stale){
    const st = document.getElementById('fbStatus')
    if(st) st.textContent = 'Carregando período…'
    const orders = await tqRows('sales_orders_whsl', [
      { method:'greaterThanEqual', attribute:'$createdAt', values:[b.fromISO] },
      { method:'lessThan', attribute:'$createdAt', values:[b.toISO] }, ORDER_FIELDS])
    const pids = orders.map(o => o.$id)
    const [hist, items] = await Promise.all([tqHistory(pids), tqItemCounts(pids)])
    periodCache = { key, orders, hist, items, at: Date.now() }
  }
  const periodIds = new Set(periodCache.orders.map(o => o.$id))
  const openIdList = open.map(o => o.$id)
  const [openHist, openItems] = await Promise.all([tqHistory(openIdList), tqItemCounts(openIdList)])
  const itemCount = Object.assign({}, periodCache.items || {}, openItems)

  const orders = new Map()
  periodCache.orders.forEach(o => orders.set(o.$id, o))
  open.forEach(o => orders.set(o.$id, o))                     // fresh status wins
  const openIds = new Set(open.map(o => o.$id))
  const hist = periodCache.hist.filter(h => !openIds.has(h.salesOrderWholesaleId)).concat(openHist)

  const histBy = {}
  hist.forEach(h => {
    if(!histBy[h.salesOrderWholesaleId]) histBy[h.salesOrderWholesaleId] = []
    histBy[h.salesOrderWholesaleId].push({ raw:h.toStatus, from:h.fromStatus, by:h.changedByUserId, assignee:h.assigneeUserId,
      changedAt: Date.parse(h.arrivedAt) || 0, leftAt: h.leftAt ? Date.parse(h.leftAt) || 0 : 0 })
  })

  const next = {}
  orders.forEach(o => {
    const h = (histBy[o.$id] || []).sort((a,b) => a.changedAt - b.changedAt)
    // when the order entered its current column = the latest history row into that status
    let changedAt = 0
    for(let i=h.length-1; i>=0; i--){ if(h[i].raw===o.status){ changedAt = h[i].changedAt; break } }
    const branch = o.branchId || 'sem_filial'
    if(!next[branch]) next[branch] = {}
    next[branch][o.$id] = {
      // same card title as the Torque board (e.g. "LM retifica - AT-B3710")
      title: o.displayCode || o.title || o.internalId || o.$id,
      cliente: o.customerNameSnapshot || '',
      vendedor: userNames[o.sellerUserId] || '',
      status: TQ_STATUS[o.status] || String(o.status||'').toLowerCase(),
      tipo: TQ_TIPO[o.priority] || '',
      createdAt: Date.parse(o.$createdAt) || 0,
      inPeriod: periodIds.has(o.$id),
      itens: itemCount[o.$id] ? itemCount[o.$id].itens : 0,
      skus: itemCount[o.$id] ? itemCount[o.$id].skus : 0,
      orderType: o.type || '',
      collectorUserId: o.collectorUserId || '',
      expeditionUserId: o.expeditionUserId || '',
      rawHist: h,
      statusChangedAt: changedAt,
      statusHistory: h.map(x => ({ status: TQ_STATUS[x.raw] || String(x.raw||'').toLowerCase(), changedAt: x.changedAt })),
      audit: h.map(x => ({ at: x.changedAt, from: x.from, to: x.raw, by: userNames[x.by] || '' }))
    }
  })
  allRequests = next
  contacts = Object.keys(next).map(id => ({ token:id, name: branchNames[id] || id }))
}

let tqTimer = null, tqBusy = false, tqPending = false
async function tqRefresh(manual){
  // a period change during a load runs right after it
  if(tqBusy){ tqPending = true; return }
  tqBusy = true
  const st = document.getElementById('fbStatus')
  try{
    if(!Object.keys(branchNames).length) await tqLoadBranches()
    if(!Object.keys(userNames).length) await tqLoadUsers()
    await tqLoad(manual)
    let n = 0
    Object.values(allRequests).forEach(reqs => Object.values(reqs).forEach(r => { if(SLA_ACTIVE.has(r.status)) n++ }))
    if(st) st.textContent = `${n} no fluxo · ${fmtTime(Date.now())}`
    syncPipelineToAndroid()
    checkSlaNotifs()
    renderGerencial()
    if(manual) toast('Pedidos atualizados')
  }catch(e){
    if(e.status===401){ tqStop(); showLogin('Sua sessão no Torque expirou. Entre de novo.'); return }
    if(st) st.textContent = 'Sem conexão'
    if(manual) toast('Não foi possível atualizar: ' + e.message)
  }finally{
    tqBusy = false
    if(tqPending){ tqPending = false; tqRefresh() }
  }
}

function tqStart(){
  document.getElementById('login').hidden = true
  tqRefresh()
  clearInterval(tqTimer)
  tqTimer = setInterval(() => tqRefresh(), TQ.pollMs)
}
function tqStop(){ clearInterval(tqTimer); tqTimer = null }

/* ── LOGIN ── */
function showLogin(msg){
  const err = document.getElementById('loginErr')
  err.textContent = msg || ''
  err.hidden = !msg
  document.getElementById('login').hidden = false
  const st = document.getElementById('fbStatus')
  if(st) st.textContent = 'Desconectado'
}

// The Torque server only creates sessions for its own web address, so sign-in happens on the
// real Torque login page (TorqueLoginActivity); this WebView then reuses the session cookie.
function startTorqueLogin(){
  if(window.AndroidBridge && AndroidBridge.openTorqueLogin){
    AndroidBridge.openTorqueLogin()
  }else{
    showLogin('Abra o app Memora Gerencial no celular para entrar.')
  }
}

async function doLogout(){
  tqStop()
  try{ await tqFetch('/account/sessions/current', { method:'DELETE' }) }catch(e){}
  if(window.AndroidBridge && AndroidBridge.clearTorqueSession){ try{ AndroidBridge.clearTorqueSession() }catch(e){} }
  S.set('tq_cookie_fallback', '')
  allRequests = {}; contacts = []
  renderGerencial()
  showLogin()
}

async function tqInit(){
  try{
    await tqFetch('/account')
    tqStart()
  }catch(e){
    showLogin(e.status===401 ? '' : 'Não foi possível conectar ao Torque. Verifique a internet.')
  }
}
window.tqInit = tqInit

document.addEventListener('visibilitychange', () => {
  if(document.visibilityState==='visible' && tqTimer) tqRefresh()
})

if(window.AndroidBridge){
  try{ const s=AndroidBridge.getAlertRecords(); if(s&&s!=='[]') slaAlerts=JSON.parse(s) }catch(e){}
  try{ const s=AndroidBridge.getNotifTs(); if(s&&s!=='{}') notifTs=JSON.parse(s) }catch(e){}
}

if(typeof Notification!=='undefined' && Notification.permission==='default'){
  Notification.requestPermission()
}

renderRangeBar()

tqInit()
renderGerencial()
setInterval(()=>{ checkSlaNotifs() }, 30000)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') checkSlaNotifs()
})
